/* ============================== GEOMETRY & ANALYSIS ============================== */
function corners(m){
  const I = inst(m.key), c = Math.cos(rad(m.rot)), s = Math.sin(rad(m.rot)), hw=I.w/2, hd=I.d/2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([u,v])=>[m.x+u*c-v*s, m.y+u*s+v*c]);
}
/* Separating-axis test between two convex quadrilaterals; returns the penetration depth. */
function satOverlap(P,Q){
  let min = Infinity;
  for(const poly of [P,Q]){
    for(let i=0;i<4;i++){
      const p1=poly[i], p2=poly[(i+1)%4], ax=[-(p2[1]-p1[1]), p2[0]-p1[0]], len=Math.hypot(ax[0],ax[1]);
      ax[0]/=len; ax[1]/=len;
      let a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;
      for(const p of P){ const d=p[0]*ax[0]+p[1]*ax[1]; a0=Math.min(a0,d); a1=Math.max(a1,d); }
      for(const p of Q){ const d=p[0]*ax[0]+p[1]*ax[1]; b0=Math.min(b0,d); b1=Math.max(b1,d); }
      const o = Math.min(a1,b1)-Math.max(a0,b0);
      if(o<=0) return 0;
      min = Math.min(min,o);
    }
  }
  return min;
}
function podPoly(){ const p=state.podium; return [[p.x-.5,p.y-.45],[p.x+.5,p.y-.45],[p.x+.5,p.y+.45],[p.x-.5,p.y+.45]]; }
function analyze(){
  const ms = state.musicians, W=state.stage.w, D=state.stage.d;
  const polys = ms.map(corners), ovl = new Set(), out = new Set();
  const pp = podPoly();
  for(let i=0;i<ms.length;i++){
    const Ii = inst(ms[i].key), ri = Math.hypot(Ii.w,Ii.d)/2;
    for(let j=i+1;j<ms.length;j++){
      const Ij = inst(ms[j].key), rj = Math.hypot(Ij.w,Ij.d)/2;
      if(Math.hypot(ms[i].x-ms[j].x, ms[i].y-ms[j].y) > ri+rj) continue;
      if(satOverlap(polys[i],polys[j])>.04){ ovl.add(ms[i].id); ovl.add(ms[j].id); }
    }
    if(satOverlap(polys[i],pp)>.04) ovl.add(ms[i].id);
    if(polys[i].some(([x,y])=>x<-.01||y<-.01||x>W+.01||y>D+.01)) out.add(ms[i].id);
  }
  let area=0, minY=D;
  ms.forEach((m,i)=>{ const I=inst(m.key); area+=I.w*I.d; polys[i].forEach(p=>minY=Math.min(minY,p[1])); });
  let far=0; ms.forEach(m=>far=Math.max(far,Math.hypot(m.x-state.podium.x,m.y-state.podium.y)));
  ui.analysis = {ovl,out,area,depth:D-minY,far};
}
function countOnStage(k){ let n=0; for(const m of state.musicians) if(m.key===k) n++; return n; }
function labelOf(m){ return {a:instAbbr(m.key), n:(state.counts[m.key]>1 || countOnStage(m.key)>1) ? String(m.num) : ""}; }

/* ============================== DRAWING ============================== */
function arcPath(cx,cy,r,a0,a1){
  const p0=[cx+r*Math.sin(rad(a0)), cy-r*Math.cos(rad(a0))], p1=[cx+r*Math.sin(rad(a1)), cy-r*Math.cos(rad(a1))];
  return `M${p0[0].toFixed(3)} ${p0[1].toFixed(3)}A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${p1[0].toFixed(3)} ${p1[1].toFixed(3)}`;
}
function shapeSVG(m){
  const I = inst(m.key), col = FAM[I.f].c, w=I.w, d=I.d, hw=w/2, hd=d/2;
  let s = `<rect x="${-hw}" y="${-hd}" width="${w}" height="${d}" rx=".06" fill="${col}" fill-opacity=".11" stroke="${col}" stroke-width="1.2"/>`;
  const player = cy=>`<circle cx="0" cy="${cy}" r=".16" fill="${col}"/>`;
  switch(I.s||"seat"){
    case "seat":
      s += `<rect x="-.22" y="${-hd+.08}" width=".44" height=".42" rx=".08" fill="${col}" fill-opacity=".3"/>` + player(-hd+.29)
        + `<line x1="0" y1="${hd-.14}" x2="0" y2="${hd-.32}" class="ink-s" stroke-width="1.2"/><line x1="-.24" y1="${hd-.14}" x2=".24" y2="${hd-.14}" class="ink-s" stroke-width="2.6" stroke-linecap="round"/>`;

    case "bass": s += `<circle cx="0" cy="${hd-.6}" r=".45" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="1.2"/><circle cx="0" cy="${hd-.6}" r=".1" fill="${col}"/>` + player(-hd+.25); break;

const hist={stack:[],i:-1};
const STORE="stageplan-project-v2", OLD_STORE="pianta-banda-v1";
function snap(){ return JSON.stringify({v:2,stage:state.stage,params:state.params,formationId:state.formationId,counts:state.counts,layoutId:state.layoutId,podium:state.podium,arcs:state.arcs,musicians:state.musicians,sizes:state.sizes}); }
function commit(){
  applyFacing();
  const s=snap();
  if(hist.stack[hist.i]!==s){ hist.stack=hist.stack.slice(0,hist.i+1); hist.stack.push(s); if(hist.stack.length>200) hist.stack.shift(); hist.i=hist.stack.length-1; persist(s); }
  renderAll();
}
function restore(s){
  const o = JSON.parse(s);
  Object.assign(state,{stage:o.stage, params:o.params, formationId:MIG_FORM[o.formationId]||o.formationId, counts:C(o.counts||{}), layoutId:MIG_LAY[o.layoutId]||o.layoutId, podium:o.podium, arcs:o.arcs||[], musicians:o.musicians||[], sizes:o.sizes||{}});
  const ids=new Set(state.musicians.map(m=>m.id)); ui.sel=new Set([...ui.sel].filter(id=>ids.has(id)));
  if(ui.activeArc && !arcById(ui.activeArc)) ui.activeArc=null;
}
function undo(){ if(hist.i<=0) return; hist.i--; restore(hist.stack[hist.i]); persist(hist.stack[hist.i]); renderAll(); }
function redo(){ if(hist.i>=hist.stack.length-1) return; hist.i++; restore(hist.stack[hist.i]); persist(hist.stack[hist.i]); renderAll(); }
let persistT=null;
function persist(s){ clearTimeout(persistT); persistT=setTimeout(()=>{ try{ localStorage.setItem(STORE,s); }catch(e){} },400); }
function validProject(o){ return o && o.stage && typeof o.stage.w==="number" && Array.isArray(o.musicians) && o.musicians.every(m=>INST[m.key]); }

let toastT=null;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2600); }
document.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return; ui.tab=b.dataset.tab; renderTop(); leftPane.parentElement.scrollTop=0; renderLeft(); });
function doGenerate(){
  if(isDrawer(document.querySelector("aside.left"))) closePanes();
  generate(); commit();
  const A=ui.analysis;
  toast(t("toast.generated",{positions:tp("count.positions", state.musicians.length), rows:tp("count.rows", state.arcs.length)}) + (A.ovl.size ? " " + tp("toast.toFix", A.ovl.size) : ""));
}
function setStage(w,d){
  w=clamp(+w||state.stage.w,4,60); d=clamp(+d||state.stage.d,3,40);
  const dx = w/2 - state.stage.w/2, dy = d - state.stage.d;
  state.stage={w,d};
  state.podium={x:r2(state.podium.x+dx), y:r2(state.podium.y+dy)};
  state.musicians.forEach(m=>{ if(!m.arc){ m.x=r2(m.x+dx); m.y=r2(m.y+dy); } });
  state.arcs.forEach(a=>{ if(a.shape==="line"){ a.x=r2(a.x+dx); a.y=r2(a.y+dy); } });
  layoutAllArcs(); commit(); fit();
}
leftPane.addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]");
  if(ed){ e.stopPropagation(); openEditor(ed.dataset.edit, ed.dataset.id); return; }
  const rs=e.target.closest("[data-reset]");
  if(rs){ resetPresets(rs.dataset.reset); return; }
  const f=e.target.closest("[data-form]");
  if(f){ const F=FORMATIONS[f.dataset.form]; if(!F) return; state.formationId=f.dataset.form; state.counts={...F.c}; if(LAYOUTS[F.lay]) state.layoutId=F.lay; doGenerate(); return; }
  if(e.target.closest("summary") || e.target.closest("details")) return;
  const l=e.target.closest("[data-lay]");
  if(l){ state.layoutId=l.dataset.lay; doGenerate(); return; }
  const st=e.target.closest("[data-step]");
  if(st){ const k=st.dataset.key; state.counts[k]=clamp((state.counts[k]|0)+(+st.dataset.step),0,40); state.formationId="custom"; ui.dirty=true; renderLeft(); renderTop(); return; }
  const pr=e.target.closest("[data-preset]");
  if(pr){ const S=STAGES.find(x=>x.id===pr.dataset.preset); if(S) setStage(S.w,S.d); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  switch(a.dataset.act){
    case "gen": doGenerate(); break;
    case "newform": openEditor("form", null); break;
    case "newlay": openEditor("lay", null); break;
    case "duplay": openEditor("lay", null, getLayoutId()); break;
    case "newstage": openEditor("stage", null); break;
    case "showall": ui.showAll=!ui.showAll; renderLeft(); break;
    case "resetsizes": state.sizes={}; layoutAllArcs(); commit(); toast(t("toast.sizesReset")); break;
  }
});
leftPane.addEventListener("keydown",e=>{
  if(!(e.key==="Enter"||e.key===" ")) return;
  const l=e.target.closest("[data-lay]"), f=e.target.closest("[data-form]");
  if(l && e.target===l){ e.preventDefault(); state.layoutId=l.dataset.lay; doGenerate(); }
  if(f && e.target===f){ e.preventDefault(); f.click(); }
});
leftPane.addEventListener("change",e=>{
  const tg=e.target;
  if(tg.dataset.count){ state.counts[tg.dataset.count]=clamp(Math.round(+tg.value||0),0,40); state.formationId="custom"; ui.dirty=true; renderLeft(); renderTop(); return; }
  if(tg.dataset.param){ const v=+tg.value; if(!isNaN(v)){ state.params[tg.dataset.param]=v; commit(); } return; }
  if(tg.dataset.stage){ setStage(tg.dataset.stage==="w"?tg.value:state.stage.w, tg.dataset.stage==="d"?tg.value:state.stage.d); return; }
  if(tg.dataset.size){ const v=clamp(+tg.value||.5,.3,5); state.sizes[tg.dataset.size]={...(state.sizes[tg.dataset.size]||{}),[tg.dataset.dim]:v}; layoutAllArcs(); commit(); return; }
});
rightPane.addEventListener("click",e=>{
  const as=e.target.closest("[data-arcsel]");
  if(as){ ui.activeArc = ui.activeArc===as.dataset.arcsel ? null : as.dataset.arcsel; renderRight(); requestRender(); return; }
  const al=e.target.closest("[data-align]"); if(al){ alignSel(al.dataset.align); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const A=ui.analysis;
  switch(b.dataset.act){
    case "add": addInst(document.getElementById("addKey").value); break;
    case "selall": ui.sel=new Set(state.musicians.map(m=>m.id)); renderRight(); requestRender(); break;
    case "rotm": rotSel(-15); break; case "rotp": rotSel(15); break; case "face": toggleFace(); break;
    case "disth": distSel("x"); break; case "distv": distSel("y"); break;
    case "attach": { const a=arcById(ui.activeArc); if(a){ attachToArc(a,selected()); commit(); } break; }
    case "detach": selected().forEach(detach); layoutAllArcs(); commit(); break;
    case "newarc": newArc(); break;
    case "newline": newLine(); break;
    case "toline": { const a=arcById(ui.activeArc); if(a){ toLine(a); commit(); toast(t("toast.toLine")); } break; }
    case "toarc": { const a=arcById(ui.activeArc); if(a){ toArc(a); commit(); toast(t("toast.toArc")); } break; }
    case "dup": dupSel(); break; case "del": delSel(); break;
    case "arcselm": { const a=arcById(ui.activeArc); if(a){ ui.sel=new Set(a.members); renderRight(); requestRender(); } break; }
    case "arcdel": deleteArc(ui.activeArc); break;
    case "renum": renumber(); commit(); toast(t("toast.renum")); break;
    case "selovl": ui.sel=new Set(A.ovl); renderRight(); requestRender(); break;
    case "selout": ui.sel=new Set(A.out); renderRight(); requestRender(); break;
  }
});
rightPane.addEventListener("input",e=>{
  const tg=e.target; if(tg.dataset.arcp!=="curv") return;
  const a=arcById(ui.activeArc); if(!a) return;
  const A=a.r-(a.off||0), c=clamp(+tg.value,2,100)/100;
  setFlatten(a, A/c - A); requestRender(); renderArcsLive(a);
});
rightPane.addEventListener("change",e=>{
  const tg=e.target;
  if(tg.dataset.tog){ ui[tg.dataset.tog]=tg.checked; renderTop(); requestRender(); return; }
  if(tg.dataset.arcp){
    const a=arcById(ui.activeArc); if(!a) return; const v=+tg.value; if(isNaN(v)) return;
    const k=tg.dataset.arcp;
    if(a.shape==="line"){
      if(k==="len") a.len=r2(clamp(v,.6,60));
      if(k==="ang") a.ang=r2(normA(v));
      if(k==="x") a.x=r2(v);
      if(k==="y") a.y=r2(v);
      layoutArc(a); commit(); return;
    }
    const mid=(a.a0+a.a1)/2, span=a.a1-a.a0;
    if(k==="r") a.r=r2(clamp(v,.6,40));
    if(k==="span"){ const sp=clamp(v,4,358); a.a0=r2(mid-sp/2); a.a1=r2(mid+sp/2); }
    if(k==="mid"){ a.a0=r2(v-span/2); a.a1=r2(v+span/2); }
    if(k==="off") setFlatten(a,v);
    layoutArc(a); commit(); return;
  }
  if(tg.dataset.mprop){
    const m=selected()[0]; if(!m) return; const p=tg.dataset.mprop;
    if(p==="key"){ m.key=tg.value; m.num=countOnStage(tg.value); if(m.arc){ const a=arcById(m.arc); if(a) layoutArc(a); } syncCounts(); }
    else { const v=+tg.value; if(isNaN(v)) return; if(p==="rot") setRot(m,v); else { if(p==="x"||p==="y") detach(m); m[p]= p==="num"? Math.max(1,Math.round(v)) : r2(v); } }
    commit();
  }
});

const editorEl = document.getElementById("editor");
window.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea") return;
  if(editorEl.classList.contains("on")) return;
  const mod=e.ctrlKey||e.metaKey, k=e.key;
  if(k==="Escape"){ if(help.classList.contains("on")){ help.classList.remove("on"); return; } if(appEl.classList.contains("open-left")||appEl.classList.contains("open-right")){ closePanes(); return; } ui.sel.clear(); ui.activeArc=null; renderRight(); requestRender(); return; }
  if(mod && (k==="z"||k==="Z")){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod && (k==="y"||k==="Y")){ e.preventDefault(); redo(); return; }
  if(mod && (k==="a"||k==="A")){ e.preventDefault(); ui.sel=new Set(state.musicians.map(m=>m.id)); renderRight(); requestRender(); return; }
  if(mod && (k==="d"||k==="D")){ e.preventDefault(); dupSel(); return; }
  if(mod) return;
  if(k===" "){ if(!ui.space){ ui.space=true; renderTop(); } e.preventDefault(); return; }
  if(k==="Delete"||k==="Backspace"){ e.preventDefault(); delSel(); return; }
  const st = e.shiftKey ? .25 : .05;
  if(k==="ArrowLeft"){ e.preventDefault(); nudge(-st,0); return; }
  if(k==="ArrowRight"){ e.preventDefault(); nudge(st,0); return; }
  if(k==="ArrowUp"){ e.preventDefault(); nudge(0,-st); return; }
  if(k==="ArrowDown"){ e.preventDefault(); nudge(0,st); return; }
  const lk=k.toLowerCase();
  if(lk==="q"){ rotSel(e.shiftKey?-5:-15); return; }
  if(lk==="e"){ rotSel(e.shiftKey?5:15); return; }
  if(lk==="o"){ toggleFace(); return; }
  if(lk==="v"){ ui.mode="select"; renderTop(); return; }
  if(lk==="h"){ ui.mode="pan"; renderTop(); return; }
  if(lk==="f"){ fit(); return; }
  if(lk==="g"){ ui.showGrid=!ui.showGrid; renderTop(); requestRender(); return; }
  if(lk==="a"){ ui.showArcs=!ui.showArcs; renderTop(); renderArcs(); requestRender(); return; }
  if(lk==="l"){ ui.showLabels=!ui.showLabels; renderTop(); requestRender(); return; }
  if(k==="?"){ help.classList.add("on"); return; }
});
window.addEventListener("keyup",e=>{ if(e.key===" "){ ui.space=false; renderTop(); } });
window.addEventListener("blur",()=>{ ui.space=false; });

/* ============================== PRESET EDITOR ============================== */
function resetPresets(type){
  if(ui.confirmReset!==type){ ui.confirmReset=type; renderLeft(); setTimeout(()=>{ if(ui.confirmReset===type){ ui.confirmReset=null; renderLeft(); } },4000); return; }
  ui.confirmReset=null;
  if(type==="form") FORMATIONS=clone(DEFAULT_FORMATIONS);
  if(type==="lay") LAYOUTS=clone(DEFAULT_LAYOUTS);
  if(type==="stage") STAGES=clone(DEFAULT_STAGES);
  saveLib(); renderAll(); toast(t("toast.presetsReset"));
}
const edBox = document.getElementById("edBox");
/* The editor works on a copy where built-in texts are resolved in the current language. */
function openEditor(type, id, fromId){
  let data;
  if(type==="form"){
    const F = id && FORMATIONS[id];
    data = F ? {n:fName(id,F), d:fDesc(id,F), lay:F.lay, c:{...F.c}} : {n:"", d:"", lay:getLayoutId(), c:{...state.counts}};
  }
  if(type==="lay"){
    const sid = fromId || id, L = sid && LAYOUTS[sid];
    data = L ? {n:lName(sid,L), kind:L.kind, d:lDesc(sid,L), use:lUse(sid,L), refsText:lRefs(sid,L).join("\n"), span:L.span, bands:(L.bands && L.bands.length ? L.bands : [L.order||[]]).map(b=>[...b])}
             : {n:"", kind:"arc", d:"", use:"", refsText:"", bands:[[],[]]};
    if(L && (L.kind==="wedge"||L.kind==="single")) data.bands=[[...(L.order||L.bands.flat())]];
    if(fromId) data.n = t("preset.copyOf",{name:data.n});
  }
  if(type==="stage"){ const S = id && STAGES.find(x=>x.id===id); data = S ? {n:sName(S), w:S.w, d:S.d} : {n:"", w:state.stage.w, d:state.stage.d}; }
  ui.edit = {type, id, data, chip:null, confirmDel:false, err:""};
  editorEl.classList.add("on"); renderEditor();
  setTimeout(()=>{ const i=edBox.querySelector("[data-ef='n']"); if(i) i.focus(); },30);
}
function closeEditor(){ editorEl.classList.remove("on"); ui.edit=null; }

  }
  if(E.err) h += `<p class="errline">${esc(E.err)}</p>`;
  const builtin = E.id && (E.type==="form" ? DEFAULT_FORMATIONS[E.id] : E.type==="lay" ? DEFAULT_LAYOUTS[E.id] : DEFAULT_STAGES.find(x=>x.id===E.id));
  h += `<div class="efoot">
    ${E.id?`<button class="btn danger" data-ea="del">${esc(t(E.confirmDel?"ed.delConfirm":"ed.del"))}</button>`:""}
    ${builtin?`<button class="btn" data-ea="orig">${esc(t("ed.orig"))}</button>`:""}
    <span class="sp"></span>
    <button class="btn" data-ea="cancel">${esc(t("btn.cancel"))}</button>
    ${E.id?`<button class="btn" data-ea="saveas">${esc(t("ed.saveAs"))}</button>`:""}
    <button class="btn primary" data-ea="save">${esc(t(E.id?"ed.save":"ed.create"))}</button></div>`;
  edBox.innerHTML = h; edBox.scrollTop = st;
}
function edCommit(asNew){
  const E=ui.edit, D=E.data;
  if(!String(D.n||"").trim()){ E.err=t("ed.err.name"); renderEditor(); return; }
  const id = (!E.id || asNew) ? "u"+uid() : E.id;
  const builtin = !asNew && E.id;
  if(E.type==="form"){
    const F = normFormation({n:D.n, d:D.d, lay:D.lay, c:D.c}, id);
    if(!total(F.c)){ E.err=t("ed.err.empty"); renderEditor(); return; }
    /* keep built-in texts translatable when they were not changed */
    if(builtin && DEFAULT_FORMATIONS[id]){ if(F.n===t(`form.${id}.n`)) delete F.n; if(F.d===t(`form.${id}.d`)) delete F.d; }
    FORMATIONS[id]=F;
    if(id===state.formationId){ state.counts={...F.c}; ui.dirty=true; }
  }
  if(E.type==="lay"){
    const refs = String(D.refsText||"").split("\n").map(x=>x.trim()).filter(Boolean);
    const L = normLayout({n:D.n, kind:D.kind, d:D.d, use:D.use, refs, span:D.span, bands:D.bands}, id);
    L.bands = L.bands.filter(b=>b.length);
    if(!L.bands.length){ E.err=t("ed.err.noInst"); renderEditor(); return; }
    if(L.order) L.bands=[L.order];
    if(builtin && DEFAULT_LAYOUTS[id]){
      if(L.n===t(`lay.${id}.n`)) delete L.n;
      if(L.d===t(`lay.${id}.d`)) delete L.d;
      if(L.use===t(`lay.${id}.use`)) delete L.use;
      if(JSON.stringify(L.refs)===JSON.stringify(t(`lay.${id}.refs`))) delete L.refs;
    }
    LAYOUTS[id]=L;
    if(id===getLayoutId()) ui.dirty=true;
  }
  if(E.type==="stage"){
    const S = normStage({n:D.n, w:D.w, d:D.d, id});
    if(builtin && DEFAULT_STAGES.some(x=>x.id===id) && S.n===t("stage."+id)) delete S.n;
    const i=STAGES.findIndex(x=>x.id===id);
    if(i>=0) STAGES[i]=S; else STAGES.push(S);
  }
  saveLib(); closeEditor(); renderAll();
  toast(t(E.id && !asNew ? "toast.presetUpdated" : "toast.presetCreated"));
}
function edDelete(){
  const E=ui.edit;
  if(!E.confirmDel){ E.confirmDel=true; renderEditor(); return; }
  const lastErr = key => { E.err=t(key); E.confirmDel=false; renderEditor(); };
  if(E.type==="form"){ if(Object.keys(FORMATIONS).length<=1) return lastErr("ed.err.lastForm"); delete FORMATIONS[E.id]; if(state.formationId===E.id) state.formationId="custom"; }
  if(E.type==="lay"){ if(Object.keys(LAYOUTS).length<=1) return lastErr("ed.err.lastLay"); delete LAYOUTS[E.id]; if(state.layoutId===E.id){ state.layoutId=Object.keys(LAYOUTS)[0]; ui.dirty=true; } }
  if(E.type==="stage"){ if(STAGES.length<=1) return lastErr("ed.err.lastStage"); STAGES=STAGES.filter(x=>x.id!==E.id); }
  saveLib(); closeEditor(); renderAll(); toast(t("toast.presetDeleted"));
}
function moveChip(b,j,nb,nj){
  const B=ui.edit.data.bands, k=B[b][j];
  B[b].splice(j,1);
  if(nj==null || nj>B[nb].length) nj=B[nb].length;
  B[nb].splice(nj,0,k); ui.edit.chip=[nb,nj];
}
edBox.addEventListener("input",e=>{
  const tg=e.target, E=ui.edit; if(!E) return;
  if(tg.dataset.ef){
    const f=tg.dataset.ef, numeric = (E.type==="stage" && (f==="w"||f==="d")) || f==="span";
    E.data[f] = numeric ? (tg.value===""?undefined:+tg.value) : tg.value;
    E.err="";
    if(f==="kind"){
      if(tg.value==="wedge"||tg.value==="single") E.data.bands=[E.data.bands.flat()];
      if(tg.value==="block") delete E.data.span;
      E.chip=null; renderEditor();
    }
  }
  if(tg.dataset.ec) E.data.c[tg.dataset.ec]=clamp(Math.round(+tg.value||0),0,40);
});
edBox.addEventListener("change",e=>{ if(e.target.dataset.ec) renderEditor(); });
edBox.addEventListener("click",e=>{
  const E=ui.edit; if(!E) return; const D=E.data;
  const ch=e.target.closest("[data-chip]");
  if(ch){ const [b,j]=ch.dataset.chip.split(":").map(Number); E.chip = (E.chip&&E.chip[0]===b&&E.chip[1]===j) ? null : [b,j]; renderEditor(); return; }
  const st=e.target.closest("[data-estep]");
  if(st){ const k=st.dataset.key; D.c[k]=clamp(D.c[k]+(+st.dataset.estep),0,40); renderEditor(); return; }
  const a=e.target.closest("[data-ea]"); if(!a || a.disabled) return;
  const act=a.dataset.ea, b=+a.dataset.b;
  if(act!=="del") E.confirmDel=false;
  switch(act){
    case "cancel": closeEditor(); return;
    case "save": edCommit(false); return;
    case "saveas": edCommit(true); return;
    case "del": edDelete(); return;
    case "orig": {
      if(E.type==="form"){ const F=DEFAULT_FORMATIONS[E.id]; E.data={n:t(`form.${E.id}.n`), d:t(`form.${E.id}.d`), lay:F.lay, c:{...F.c}}; }
      if(E.type==="lay"){ const L=DEFAULT_LAYOUTS[E.id]; E.data={n:t(`lay.${E.id}.n`), kind:L.kind, d:t(`lay.${E.id}.d`), use:t(`lay.${E.id}.use`), refsText:(t(`lay.${E.id}.refs`)||[]).join("\n"), span:L.span, bands:(L.bands||[L.order]).map(x=>[...x])}; }
      if(E.type==="stage"){ const S=DEFAULT_STAGES.find(x=>x.id===E.id); E.data={n:t("stage."+E.id), w:S.w, d:S.d}; }
      E.chip=null; break; }
    case "fromstage": D.c={...state.counts}; break;
    case "zero": Object.keys(D.c).forEach(k=>D.c[k]=0); break;
    case "stagecur": D.w=state.stage.w; D.d=state.stage.d; break;
    case "addband": D.bands.push([]); break;
    case "bu": [D.bands[b-1],D.bands[b]]=[D.bands[b],D.bands[b-1]]; E.chip=null; break;
    case "bd": [D.bands[b+1],D.bands[b]]=[D.bands[b],D.bands[b+1]]; E.chip=null; break;
    case "bx": { const rem=D.bands.splice(b,1)[0]; if(rem.length) D.bands[Math.max(0,b-1)].push(...rem); E.chip=null; break; }
    case "add": { const sel=edBox.querySelector(`[data-addsel="${b}"]`); if(sel && sel.value){ D.bands[b].push(sel.value); E.chip=[b,D.bands[b].length-1]; } break; }
    case "cl": case "cr": case "cu": case "cd": case "cx": {
      if(!E.chip) break; const [cb,cj]=E.chip;
      if(act==="cl") moveChip(cb,cj,cb,cj-1);
      if(act==="cr") moveChip(cb,cj,cb,cj+1);
      if(act==="cu") moveChip(cb,cj,cb-1,null);
      if(act==="cd") moveChip(cb,cj,cb+1,null);
      if(act==="cx"){ D.bands[cb].splice(cj,1); E.chip=null; }
      break; }
  }
  renderEditor();
});
let dragChip=null;
edBox.addEventListener("dragstart",e=>{ const c=e.target.closest("[data-chip]"); if(!c) return; dragChip=c.dataset.chip.split(":").map(Number); e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",c.dataset.chip); }catch(_){} });
edBox.addEventListener("dragover",e=>{ const z=e.target.closest("[data-drop]"); if(!z||!dragChip) return; e.preventDefault(); edBox.querySelectorAll(".chips.over").forEach(x=>x!==z&&x.classList.remove("over")); z.classList.add("over"); });
edBox.addEventListener("dragleave",e=>{ const z=e.target.closest("[data-drop]"); if(z && !z.contains(e.relatedTarget)) z.classList.remove("over"); });
edBox.addEventListener("drop",e=>{
  const z=e.target.closest("[data-drop]"); if(!z||!dragChip) return; e.preventDefault();
  const nb=+z.dataset.drop; let nj=null;
  const over=e.target.closest("[data-chip]");
  if(over){ const [ob,oj]=over.dataset.chip.split(":").map(Number); const r=over.getBoundingClientRect(); nj = oj + (e.clientX > r.left+r.width/2 ? 1 : 0); if(ob===dragChip[0] && dragChip[1]<nj) nj--; }
  moveChip(dragChip[0],dragChip[1],nb,nj); dragChip=null; renderEditor();
});
edBox.addEventListener("dragend",()=>{ dragChip=null; edBox.querySelectorAll(".chips.over").forEach(x=>x.classList.remove("over")); });
editorEl.addEventListener("click",e=>{ if(e.target===editorEl) closeEditor(); });
editorEl.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.stopPropagation(); closeEditor(); } });

/* ============================== INSTALL AS APP ============================== */
let installEvt = null;
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints>1);
const isAndroid = /Android/.test(UA);
const inFrame = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const isStandalone = ()=> (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
const instBar = document.getElementById("installBar"), instHelp = document.getElementById("instHelp");
const INSTALL_LATER = "stageplan-install-later";
function updInstall(){ document.getElementById("bInstall").hidden = isStandalone(); }
function maybeShowBar(){
  if(isStandalone()) return;
  let later = 0; try{ later = +localStorage.getItem(INSTALL_LATER)||0; }catch(e){}
  if(Date.now()-later < 7*864e5) return;
  if(isIOS || isAndroid || installEvt) instBar.classList.add("on");
}
function hideBar(remember){ instBar.classList.remove("on"); if(remember){ try{ localStorage.setItem(INSTALL_LATER, String(Date.now())); }catch(e){} } }
function steps(key){ return `<ol class="steps">${(t(key)||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`; }
function openInstHelp(){
  const both = !isIOS && !isAndroid;
  const ios = `<div class="inst-sec"><h3>${esc(t("inst.ios"))}</h3>${steps("inst.iosSteps")}</div>`;
  const andr = `<div class="inst-sec"><h3>${esc(t("inst.android"))}</h3>${steps("inst.androidSteps")}</div>`;
  const desk = `<div class="inst-sec"><h3>${esc(t("inst.desktop"))}</h3>${steps("inst.desktopSteps")}</div>`;
  document.getElementById("instBox").innerHTML = `<h2 id="instT">${esc(t("inst.title"))}</h2>
    <p class="hint">${esc(t("inst.intro"))}</p>
    ${inFrame?`<div class="inst-note">${esc(t("inst.frame"))}</div>`:""}
    ${isIOS?ios:""}${isAndroid?andr:""}${both?ios+andr+desk:""}
    <div class="btnrow"><button class="btn primary" id="instClose">${esc(t("btn.gotIt"))}</button></div>`;
  instHelp.classList.add("on");
  document.getElementById("instClose").onclick = ()=>instHelp.classList.remove("on");
}
async function doInstall(){
  if(installEvt){
    const ev = installEvt; installEvt = null;
    try{ ev.prompt(); const r = await ev.userChoice; if(r && r.outcome==="accepted") hideBar(false); }catch(e){ openInstHelp(); }
    return;
  }
  openInstHelp();
}
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt = e; maybeShowBar(); });
window.addEventListener("appinstalled", ()=>{ installEvt=null; hideBar(false); updInstall(); toast(t("toast.installed")); });
document.getElementById("instGo").onclick = ()=>{ hideBar(false); doInstall(); };
document.getElementById("instNo").onclick = ()=>hideBar(true);
document.getElementById("bInstall").onclick = doInstall;
instHelp.addEventListener("click", e=>{ if(e.target===instHelp) instHelp.classList.remove("on"); });

/* ============================== LANGUAGE ============================== */
const HELP_ROWS = ["click","shift","ctrl","marquee","drag","alt","arrows","qe","o","handle","all","dup","del","undo","wheel","space","arc","keys"];
const langHooks = [];
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t("app.title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{ el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{ el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  document.getElementById("helpRows").innerHTML = HELP_ROWS.map(k=>`<kbd>${esc(t(`help.${k}.k`))}</kbd><span>${esc(t(`help.${k}.d`))}</span>`).join("");
  document.getElementById("hudPos").textContent = t("hud.pos",{x:"–", y:"–"});
  const sel = document.getElementById("langSel");
  sel.innerHTML = LANGS.map(([c,n])=>`<option value="${c}"${c===LANG?" selected":""}>${n}</option>`).join("");
}
function setLang(l){
  if(!I18N[l]) return;
  LANG = l; try{ localStorage.setItem(LANG_KEY, l); }catch(e){}
  applyStatic(); renderAll(); if(ui.edit) renderEditor();
  if(instHelp.classList.contains("on")) openInstHelp();
  langHooks.forEach(fn=>{ try{ fn(); }catch(e){} });
}
document.getElementById("langSel").addEventListener("change", e=>setLang(e.target.value));

/* ============================== START ============================== */
(function init(){
  applyStatic();
  loadLib();
  let loaded=false;
  try{
    const s = localStorage.getItem(STORE) || localStorage.getItem(OLD_STORE);
    if(s){ const o=JSON.parse(s); if(validProject(o)){ restore(s); loaded=true; } }
  }catch(e){}
  if(!loaded) generate();
  hist.stack=[snap()]; hist.i=0;
  renderAll();
  requestAnimationFrame(fit);
  updInstall();
  setTimeout(maybeShowBar, 1500);
  if(loaded) setTimeout(()=>toast(t("toast.resumed")),300);
})();

</script>

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
