<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2456A6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Podium">
<title>Podium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8EC; --panel:#F7F8F9; --panel2:#EDF0F3; --ink:#1A2130; --muted:#5B6677; --line:#D3D9E0;
  --accent:#2456A6; --accent-soft:rgba(36,86,166,.12); --accent-ink:#FFFFFF;
  --warn:#C23A2B; --caution:#C47500; --ok:#2E7D4F;
  --canvas:#C8CED5; --floor:#E3CEA6; --plank:#CFB488; --edge:#6F5230; --grid:rgba(70,45,10,.13); --grid2:rgba(70,45,10,.28);
  --label-halo:#F3E6CC;
  --ui:"Barlow", "Segoe UI", "Helvetica Neue", Arial, "Hiragino Sans", "Noto Sans JP", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --cond:"Barlow Semi Condensed", "Arial Narrow", "Barlow", Arial, "Hiragino Sans", "Noto Sans JP", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161B; --panel:#1A1F26; --panel2:#222831; --ink:#E3E7ED; --muted:#98A2B1; --line:#2D343E;
    --accent:#76A3EE; --accent-soft:rgba(118,163,238,.16); --accent-ink:#0D1320;
    --warn:#F0725F; --caution:#F0A43A; --ok:#5CC48A;
    --canvas:#0D1014; --floor:#3A3026; --plank:#2E251C; --edge:#B88B55; --grid:rgba(255,226,180,.07); --grid2:rgba(255,226,180,.17);
    --label-halo:#3A3026;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161B; --panel:#1A1F26; --panel2:#222831; --ink:#E3E7ED; --muted:#98A2B1; --line:#2D343E;
  --accent:#76A3EE; --accent-soft:rgba(118,163,238,.16); --accent-ink:#0D1320;
  --warn:#F0725F; --caution:#F0A43A; --ok:#5CC48A;
  --canvas:#0D1014; --floor:#3A3026; --plank:#2E251C; --edge:#B88B55; --grid:rgba(255,226,180,.07); --grid2:rgba(255,226,180,.17);
  --label-halo:#3A3026;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased; overflow:hidden; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

:root{ --lw:clamp(290px, 19vw, 380px); --rw:clamp(270px, 17vw, 340px); }
.app{ height:100%; display:grid; grid-template-columns: var(--lw) minmax(0,1fr) var(--rw); grid-template-rows: auto minmax(0,1fr); grid-template-areas:"top top top" "left main right"; }
.topbar{ grid-area:top; display:flex; align-items:center; gap:14px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); min-height:54px; flex-wrap:nowrap; min-width:0; }
.brand{ display:flex; align-items:center; gap:10px; margin-right:6px; }
.brand svg{ flex:none; }
.brand b{ font-family:var(--cond); font-size:19px; font-weight:700; letter-spacing:.01em; }
.brand small{ display:block; color:var(--muted); font-size:12px; margin-top:-2px; }
.summary{ font-size:13px; color:var(--muted); display:flex; gap:6px; flex-wrap:nowrap; min-width:0; overflow:hidden; flex:0 1000 auto; }
.summary span{ background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:2px 8px; color:var(--ink); white-space:nowrap; }
.tools{ margin-left:auto; display:flex; gap:4px; flex-wrap:nowrap; align-items:center; overflow-x:auto; min-width:0; scrollbar-width:none; }
.tools::-webkit-scrollbar{ display:none; }
.tools{ flex:0 1 auto; }
.brand{ flex:none; }
.ptoggles{ display:none; gap:4px; flex:none; }
.pbadge{ font-style:normal; min-width:18px; height:18px; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:700; display:none; align-items:center; justify-content:center; padding:0 5px; }
.pbadge.on{ display:inline-flex; }
.tsep{ width:1px; height:24px; background:var(--line); margin:0 4px; }
.tb{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 9px; border:1px solid transparent; border-radius:6px; background:transparent; font-size:13px; }
.tb:hover{ background:var(--panel2); border-color:var(--line); }
.tb[aria-pressed="true"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.tb:disabled{ opacity:.4; cursor:default; }
.tb svg{ width:17px; height:17px; flex:none; }
.tb .tl{ white-space:nowrap; }
@media (max-width:1439px){ .brand small{ display:none; } }
@media (max-width:1023px){ .langw select{ max-width:92px; } }
@media (max-width:899px), (max-height:560px){ .summary{ display:none !important; } }
/* compact steps applied by script when the toolbar does not fit (label length depends on the language) */
.topbar.c1 .tb .tl.opt, .topbar.c1 .summary{ display:none; }
.topbar.c2 .tb .tl, .topbar.c2 .brand > div{ display:none; }
.topbar.c2 .tb{ padding:0 7px; }

aside{ background:var(--panel); overflow:auto; min-height:0; }
aside.left{ grid-area:left; border-right:1px solid var(--line); display:flex; flex-direction:column; }
aside.right{ grid-area:right; border-left:1px solid var(--line); }
main.stage{ grid-area:main; }
.drawerhead{ display:none; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--cond); font-size:17px; font-weight:700; }
.drawerhead .ebtn{ margin-left:auto; width:34px; height:34px; }
.scrim{ display:none; }
.tabs{ display:flex; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2; }
.tabs button{ flex:1; border:0; background:transparent; padding:11px 6px 9px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; }
.tabs button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--accent); }
.tabpane{ padding:4px 14px 18px; flex:1; }
.sec{ padding:12px 0 14px; border-bottom:1px solid var(--line); }
.sec:last-child{ border-bottom:0; }
.sec h3{ margin:0 0 9px; font-family:var(--cond); font-size:16px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.sec h3 .aside{ margin-left:auto; font-family:var(--ui); font-weight:500; font-size:12.5px; color:var(--muted); }
.hint{ color:var(--muted); font-size:12.5px; margin:0 0 8px; }
.card{ display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:9px 11px; margin-bottom:6px; }
.card:hover{ border-color:var(--muted); }
.card[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
.card .ct{ display:flex; align-items:baseline; gap:8px; font-weight:600; }
.card .ct em{ font-style:normal; margin-left:auto; font-weight:500; color:var(--muted); font-size:12.5px; white-space:nowrap; }
.card p{ margin:4px 0 0; font-size:12.5px; color:var(--muted); }
.badge{ display:inline-block; font-size:11.5px; font-weight:600; color:var(--ok); border:1px solid currentColor; border-radius:10px; padding:0 7px; margin-top:5px; }
.card details{ margin-top:6px; font-size:12.5px; }
.card summary{ cursor:pointer; color:var(--accent); font-weight:600; }
.card ul{ margin:6px 0 0; padding-left:18px; color:var(--ink); }
.card li{ margin-bottom:4px; }
.card .uso{ margin-top:4px; font-size:12.5px; }
.refnote{ font-size:11.5px; color:var(--muted); margin-top:6px; }

.famhead{ display:flex; align-items:center; gap:7px; margin:10px 0 4px; font-weight:600; font-size:13px; }
.famhead i{ width:10px; height:10px; border-radius:2px; flex:none; }
.famhead span{ margin-left:auto; color:var(--muted); font-weight:500; }
.crow{ display:flex; align-items:center; gap:8px; padding:2px 0 2px 17px; font-size:13px; }
.crow > span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.crow.zero > span{ color:var(--muted); }
.stepper{ display:flex; align-items:center; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel); }
.stepper button{ width:26px; height:26px; border:0; background:var(--panel2); font-size:15px; line-height:1; }
.stepper button:hover{ background:var(--line); }
.stepper input{ width:36px; height:26px; border:0; text-align:center; background:transparent; -moz-appearance:textfield; font-variant-numeric:tabular-nums; }
.stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; }
.linkbtn{ border:0; background:none; color:var(--accent); font-weight:600; padding:4px 0; font-size:13px; }
.banner{ background:var(--accent-soft); border:1px solid var(--accent); border-radius:7px; padding:8px 10px; font-size:13px; display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.banner button{ margin-left:auto; }

.field{ display:grid; grid-template-columns:1fr 92px; align-items:center; gap:8px; margin-bottom:7px; font-size:13px; }
.field input,.field select, .inp{ height:30px; border:1px solid var(--line); border-radius:6px; background:var(--panel); padding:0 8px; width:100%; font-variant-numeric:tabular-nums; }
.field input:focus,.inp:focus{ border-color:var(--accent); outline:none; box-shadow:0 0 0 2px var(--accent-soft); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
.mini{ display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); }
.mini input{ height:28px; border:1px solid var(--line); border-radius:6px; background:var(--panel); padding:0 7px; color:var(--ink); font-variant-numeric:tabular-nums; width:100%; }
.btn{ height:32px; padding:0 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); font-weight:600; font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn:hover{ border-color:var(--muted); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.danger{ color:var(--warn); }
.btn.wide{ width:100%; }
.btn svg{ width:16px; height:16px; }
.btnrow{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.btnrow .btn{ flex:1 1 auto; }
.iconrow{ display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin-top:6px; }
.iconrow .btn{ padding:0; }
.presets{ display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
.presets button{ border:1px solid var(--line); background:var(--panel2); border-radius:14px; padding:3px 10px; font-size:12.5px; }
.presets button:hover{ border-color:var(--muted); }
.sticky-gen{ position:sticky; bottom:0; background:var(--panel); padding:10px 0 4px; border-top:1px solid var(--line); margin-top:8px; }

table.sizes{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.sizes th{ text-align:left; font-weight:600; color:var(--muted); padding:4px 2px; border-bottom:1px solid var(--line); }
table.sizes td{ padding:2px; border-bottom:1px solid var(--line); }
table.sizes input{ width:54px; height:24px; border:1px solid var(--line); border-radius:4px; background:var(--panel); padding:0 4px; font-variant-numeric:tabular-nums; }

.arcitem{ border:1px solid var(--line); border-radius:7px; padding:8px 10px; margin-bottom:6px; background:var(--panel); }
.arcitem.active{ border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); }
.arcitem header{ display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; margin-bottom:6px; }
.arcitem header span{ margin-left:auto; color:var(--muted); font-weight:500; font-size:12.5px; }
.arcitem .grid2{ margin-bottom:6px; }
.toggle{ display:flex; align-items:center; gap:8px; font-size:13px; margin:3px 0; cursor:pointer; }
.toggle input{ accent-color:var(--accent); width:16px; height:16px; }

.stats{ display:grid; grid-template-columns:1fr auto; gap:3px 10px; font-size:13px; }
.stats dt{ color:var(--muted); }
.stats dd{ margin:0; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
.warn{ border-radius:7px; padding:7px 10px; font-size:12.5px; margin-top:8px; display:flex; gap:8px; align-items:flex-start; }
.warn.bad{ background:color-mix(in srgb, var(--warn) 12%, transparent); color:var(--ink); border:1px solid color-mix(in srgb, var(--warn) 50%, transparent); }
.warn.mid{ background:color-mix(in srgb, var(--caution) 12%, transparent); border:1px solid color-mix(in srgb, var(--caution) 50%, transparent); }
.warn.good{ background:color-mix(in srgb, var(--ok) 12%, transparent); border:1px solid color-mix(in srgb, var(--ok) 45%, transparent); }
.warn button{ margin-left:auto; white-space:nowrap; }
.legend{ display:grid; grid-template-columns:1fr; gap:4px; font-size:12.5px; }
.legend div{ display:flex; align-items:center; gap:8px; }
.legend i{ width:12px; height:12px; border-radius:3px; flex:none; }
.legend span{ margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }

main.stage{ position:relative; min-width:0; min-height:0; background:var(--canvas); overflow:hidden; }
#cv{ width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
#cv.pan{ cursor:grab; } #cv.panning{ cursor:grabbing; }
.hud{ position:absolute; left:10px; bottom:10px; display:flex; gap:8px; align-items:center; font-size:12px; pointer-events:none; }
.hud span{ background:color-mix(in srgb, var(--panel) 88%, transparent); border:1px solid var(--line); border-radius:5px; padding:3px 8px; font-variant-numeric:tabular-nums; }
.zoomctl{ position:absolute; right:10px; bottom:10px; display:flex; background:var(--panel); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.zoomctl button{ width:34px; height:32px; border:0; background:transparent; font-size:16px; }
.zoomctl button:hover{ background:var(--panel2); }
.toast{ position:absolute; top:64px; left:50%; transform:translateX(-50%) translateY(-8px); background:var(--ink); color:var(--panel); padding:7px 14px; border-radius:7px; font-size:13px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:80%; text-align:center; }
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){ .toast{ transition:none; } }

/* SVG */
.st-floor{ fill:var(--floor); }
.st-plank{ stroke:var(--plank); stroke-width:1; fill:none; }
.st-edge{ fill:none; stroke:var(--edge); stroke-width:2; }
.st-front{ stroke:var(--edge); stroke-width:5; }
.st-grid{ stroke:var(--grid); stroke-width:1; }
.st-grid2{ stroke:var(--grid2); stroke-width:1; }
.st-dim{ fill:var(--muted); font-family:var(--cond); font-weight:600; }
.st-dimline{ stroke:var(--muted); stroke-width:1; fill:none; }
.st-aud{ fill:var(--muted); font-family:var(--cond); font-weight:600; letter-spacing:.04em; }
.pod-r{ fill:var(--panel); stroke:var(--ink); stroke-width:1.5; }
.pod-t{ fill:var(--ink); font-family:var(--cond); font-weight:700; }
.ink-s{ stroke:var(--ink); }
.ink-f{ fill:var(--ink); }
.lbl{ fill:var(--ink); font-family:var(--cond); font-weight:700; paint-order:stroke; stroke:var(--label-halo); stroke-linejoin:round; }
.lbl .n{ font-weight:500; }
.arc-l{ fill:none; stroke:var(--ink); stroke-opacity:.42; stroke-width:1.4; stroke-dasharray:6 5; }
.arc-l.act{ stroke:var(--accent); stroke-opacity:1; stroke-width:2.2; stroke-dasharray:none; }
.arc-l.drop{ stroke:var(--ok); stroke-opacity:1; stroke-width:3; stroke-dasharray:none; }
.arc-hit{ fill:none; stroke:transparent; stroke-width:14; cursor:pointer; }
.arc-tag{ fill:var(--ink); fill-opacity:.6; font-family:var(--cond); font-weight:700; }
.arc-tag.act{ fill:var(--accent); fill-opacity:1; }
.guide{ stroke:var(--accent); stroke-width:1; stroke-dasharray:3 4; fill:none; }
.hdl{ fill:var(--panel); stroke:var(--accent); stroke-width:2; cursor:grab; }
.hdl.r{ fill:var(--accent); }
.hdl.rot{ fill:var(--panel); }
.face-l{ stroke:var(--accent); stroke-width:1; stroke-dasharray:2 4; stroke-opacity:.7; }
.facebtn[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.seg{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-bottom:8px; }
.seg button{ flex:1; height:30px; border:0; background:var(--panel2); font-weight:600; font-size:13px; color:var(--muted); }
.seg button + button{ border-left:1px solid var(--line); }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.arcitem header .shp{ color:var(--muted); font-weight:500; font-size:12px; }
.hdl.off{ fill:var(--accent); fill-opacity:.85; stroke:var(--panel); cursor:ns-resize; }
.hdl-ico{ fill:var(--accent); font-weight:700; }
.arc-l.dim{ stroke-opacity:.16; }
.arc-pill{ fill:var(--panel); fill-opacity:.8; stroke:var(--ink); stroke-opacity:.25; stroke-width:1; }
.arc-tagg{ cursor:pointer; }
.arc-tagg:hover .arc-pill{ stroke:var(--accent); stroke-opacity:1; }
.arc-tagg.act .arc-pill{ fill:var(--accent); fill-opacity:1; stroke:var(--accent); }
.arc-tagg.act .arc-tag{ fill:var(--accent-ink); fill-opacity:1; }
.arc-tagg.dim{ opacity:.4; }
.arcm-o{ fill:var(--accent); fill-opacity:.07; stroke:var(--accent); stroke-width:1.6; }
.archint{ position:absolute; top:10px; left:10px; right:60px; display:none; pointer-events:none; }
.archint.on{ display:flex; }
.archint span{ background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--accent); border-radius:7px; padding:6px 10px; font-size:12.5px; max-width:760px; }
.archint b{ color:var(--accent); }
.hdl-t{ fill:var(--accent); font-family:var(--cond); font-weight:700; paint-order:stroke; stroke:var(--panel); }
.mq{ fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; stroke-dasharray:4 3; }
.mus{ cursor:move; }
.sel-o{ fill:none; stroke:var(--accent); stroke-width:2.6; }
.ovl-o{ fill:none; stroke:var(--warn); stroke-width:2; stroke-dasharray:4 3; }
.out-o{ fill:none; stroke:var(--caution); stroke-width:2; stroke-dasharray:2 3; }
svg *{ vector-effect:non-scaling-stroke; }
.lbl, .lbl *{ vector-effect:none; }

.ebtn{ margin-left:6px; width:26px; height:24px; border:1px solid transparent; border-radius:5px; background:transparent; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; flex:none; }
.ebtn:hover{ border-color:var(--line); background:var(--panel2); color:var(--ink); }
.ebtn svg{ width:14px; height:14px; }
.card .ct .ebtn{ margin-left:auto; align-self:center; }
.card .ct em + .ebtn{ margin-left:6px; }
.linkbtn.danger{ color:var(--warn); }
.badge.mine{ color:var(--accent); }
.pchip{ display:inline-flex; align-items:center; border:1px solid var(--line); background:var(--panel2); border-radius:14px; padding-right:2px; }
.pchip.on{ border-color:var(--accent); background:var(--accent-soft); }
.pchip > button:first-child{ border:0; background:none; padding:3px 4px 3px 10px; font-size:12.5px; }
.pchip .ebtn{ margin-left:0; width:22px; height:22px; border-radius:11px; padding:0; border-color:transparent; background:transparent; }
.presets button{ }
.resetrow{ margin-top:4px; }
textarea.inp{ height:auto; min-height:64px; padding:6px 8px; resize:vertical; line-height:1.4; font:inherit; }
.modal .box.wide{ max-width:780px; }
.ed-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; }
.ed-grid .full{ grid-column:1 / -1; }
.ed-sec{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.ed-sec h4{ margin:0 0 6px; font-family:var(--cond); font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ed-sec h4 span{ color:var(--muted); font-family:var(--ui); font-weight:500; font-size:12.5px; }
.ed-sec h4 .btn{ margin-left:auto; height:28px; }
.ed-counts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:0 16px; }
.ed-counts .crow{ padding-left:0; }
.band{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; background:var(--panel2); }
.band .bh{ display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; margin-bottom:6px; }
.band .bh small{ color:var(--muted); font-weight:500; }
.band .bh .sp{ margin-left:auto; display:flex; gap:4px; }
.band .bh .sp button{ width:28px; height:26px; border:1px solid var(--line); border-radius:5px; background:var(--panel); }
.band .bh .sp button:disabled{ opacity:.35; cursor:default; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; min-height:34px; padding:3px; border-radius:6px; border:1px dashed transparent; }
.chips.over{ border-color:var(--accent); background:var(--accent-soft); }
.chip{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px 0 8px; border:1px solid var(--line); border-left:4px solid var(--c); border-radius:6px; background:var(--panel); font-size:12.5px; cursor:grab; }
.chip[aria-pressed="true"]{ outline:2px solid var(--accent); outline-offset:1px; }
.chips .empty{ color:var(--muted); font-size:12.5px; padding:5px 4px; }
.addrow{ display:flex; gap:6px; margin-top:6px; }
.addrow select{ flex:1; }
.chipbar{ position:sticky; top:-18px; z-index:2; background:var(--panel); border:1px solid var(--accent); border-radius:8px; padding:7px 10px; margin-bottom:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; }
.chipbar b{ margin-right:auto; }
.chipbar .btn{ height:28px; padding:0 9px; }
.efoot{ display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
.efoot .sp{ flex:1; }
.errline{ color:var(--warn); font-size:12.5px; margin-top:4px; }
.installbar{ position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:40; display:none; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--accent); border-radius:12px; padding:10px 10px 10px 12px; box-shadow:0 8px 28px rgba(0,0,0,.22); max-width:560px; margin:0 auto; }
.installbar.on{ display:flex; }
.installbar svg{ flex:none; }
.installbar div{ flex:1; min-width:0; font-size:13px; }
.installbar b{ display:block; font-family:var(--cond); font-size:16px; }
.installbar span{ color:var(--muted); }
.installbar .ebtn{ margin:0; }
.steps{ margin:6px 0 12px; padding-left:22px; font-size:14px; }
.steps li{ margin-bottom:6px; }
.inst-sec h3{ font-family:var(--cond); font-size:16px; margin:12px 0 4px; }
.inst-note{ background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px; padding:8px 10px; font-size:13px; margin:8px 0; }
/* modal */
.modal{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal.on{ display:flex; }
.modal .box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; max-width:560px; width:100%; max-height:90%; overflow:auto; padding:18px 20px; }
.modal h2{ font-family:var(--cond); margin:0 0 10px; font-size:20px; }
.kb{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; }
kbd{ font-family:var(--ui); font-size:12px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:1px 6px; background:var(--panel2); white-space:nowrap; }

/* Right panel becomes a drawer on medium screens */
@media (max-width:1279px){
  .app{ grid-template-columns: var(--lw) minmax(0,1fr); grid-template-areas:"top top" "left main"; }
  aside.right{ position:fixed; top:0; right:0; bottom:0; width:min(360px, 92vw); z-index:35; transform:translateX(105%); visibility:hidden; transition:transform .22s ease, visibility 0s .22s; box-shadow:-8px 0 30px rgba(0,0,0,.2); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); border-left:1px solid var(--line); }
  .app.open-right aside.right{ transform:none; visibility:visible; transition:transform .22s ease; }
  .ptoggles{ display:inline-flex; }
  #bLeftPane{ display:none; }
  aside.right .drawerhead{ display:flex; }
}
/* Both panels become drawers on phones and short screens */
@media (max-width:899px), (max-height:560px){
  .app{ grid-template-columns: minmax(0,1fr); grid-template-areas:"top" "main"; }
  aside.left{ position:fixed; top:0; left:0; bottom:0; width:min(380px, 92vw); z-index:35; transform:translateX(-105%); visibility:hidden; transition:transform .22s ease, visibility 0s .22s; box-shadow:8px 0 30px rgba(0,0,0,.2); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .app.open-left aside.left{ transform:none; visibility:visible; transition:transform .22s ease; }
  #bLeftPane{ display:inline-flex; }
  aside.left .drawerhead{ display:flex; }
  .brand > div{ display:none; }
  .tb .tl{ display:none; }
  .tb{ padding:0 7px; }
  .topbar{ padding:6px 8px; gap:6px; min-height:48px; }
  #hudPos{ display:none; }
  .archint span{ font-size:12px; }
}
@media (max-height:560px){ .hud{ display:none; } .archint{ display:none !important; } }
#bMore{ display:none; }
@media (max-width:899px), (max-height:560px){ .tools{ gap:2px; } .tb{ padding:0 6px; } .langw select{ max-width:80px; } }
/* Phones: secondary tools fold into the “More” panel */
@media (max-width:599px){
  #bMore{ display:inline-flex; }
  .tools .sec2{ display:none; }
  .tools{ -webkit-mask-image:none; mask-image:none; padding-right:0; }
  .tools.more-open{ position:fixed; top:calc(48px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:40; flex-wrap:wrap; justify-content:flex-start; gap:6px; padding:10px; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:0 10px 24px rgba(0,0,0,.18); overflow:visible; }
  .tools.more-open .sec2{ display:inline-flex; }
  .tools.more-open .tsep{ display:none; }
  .tools.more-open .tb .tl{ display:inline; }
  .tools.more-open .tb{ height:38px; padding:0 10px; border-color:var(--line); }
  .tools.more-open .langw select{ max-width:none; }
  .tools.more-open #bMore{ order:-1; width:100%; justify-content:flex-start; }
}
.app.open-left .scrim, .app.open-right .scrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:34; }
@media (prefers-reduced-motion: reduce){ aside.left, aside.right{ transition:none !important; } }
/* Large monitors: scale the interface chrome, keep the plan full size */
@media (min-width:2200px){
  :root{ --lw:420px; --rw:380px; }
  .topbar, aside .tabpane, aside .tabs, .modal .box, .installbar, .toast, .hud, .zoomctl, .archint{ zoom:1.22; }
}
@media (min-width:3000px){
  :root{ --lw:540px; --rw:480px; }
  .topbar, aside .tabpane, aside .tabs, .modal .box, .installbar, .toast, .hud, .zoomctl, .archint{ zoom:1.55; }
}
.langw{ display:inline-flex; align-items:center; gap:4px; height:32px; padding:0 6px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
.langw svg{ width:16px; height:16px; flex:none; color:var(--muted); }
.langw select{ border:0; background:transparent; font-size:13px; height:30px; padding:0 2px; cursor:pointer; }
.langw select:focus{ outline:none; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="var(--floor)" stroke="var(--edge)"/><path d="M6 25 A11 11 0 0 1 28 25" fill="none" stroke="var(--edge)" stroke-width="2"/><path d="M10.5 25 A6.5 6.5 0 0 1 23.5 25" fill="none" stroke="var(--edge)" stroke-width="2"/><rect x="14.5" y="26" width="5" height="4" rx="1" fill="var(--ink)"/></svg>

      <button class="tb" id="bRightPane" data-i18n-title="pane.right.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M12 3v14"/></svg><span class="tl" data-i18n="pane.right"></span><i class="pbadge" id="selBadge"></i></button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="tools" role="toolbar" data-i18n-aria="tb.aria">
      <button class="tb" id="bUndo" data-i18n-title="tb.undo.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 5 3 9l4 4"/><path d="M3.5 9H12a5 5 0 0 1 0 10H9"/></svg><span class="tl opt" data-i18n="tb.undo"></span></button>
      <button class="tb" id="bRedo" data-i18n-title="tb.redo.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m13 5 4 4-4 4"/><path d="M16.5 9H8a5 5 0 0 0 0 10h3"/></svg><span class="tl opt" data-i18n="tb.redo"></span></button>
      <span class="tsep"></span>
      <button class="tb" id="bSel" data-i18n-title="tb.select.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 3l11 6-5 1.5L8 16z"/></svg><span class="tl" data-i18n="tb.select"></span></button>
      <button class="tb" id="bPan" data-i18n-title="tb.pan.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 2v16M2 10h16M10 2 8 4m2-2 2 2M10 18l-2-2m2 2 2-2M2 10l2-2m-2 2 2 2M18 10l-2-2m2 2-2 2"/></svg><span class="tl" data-i18n="tb.pan"></span></button>
      <button class="tb" id="bFit" data-i18n-title="tb.fit.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg><span class="tl opt" data-i18n="tb.fit"></span></button>
      <button class="tb" id="bMore" data-i18n-title="tb.more.t" aria-expanded="false"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="15.5" cy="10" r="1.7"/></svg><span class="tl" data-i18n="tb.more"></span></button>
      <span class="tsep sec2"></span>
      <button class="tb sec2" id="bGrid" data-i18n-title="tb.grid.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h14v14H3zM3 8h14M3 12.5h14M8 3v14M12.5 3v14"/></svg><span class="tl opt" data-i18n="tb.grid"></span></button>
      <button class="tb sec2" id="bSnap" data-i18n-title="tb.snap.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3v7a5 5 0 0 0 10 0V3M5 6h3M12 6h3"/></svg><span class="tl opt" data-i18n="tb.snap"></span></button>
      <button class="tb sec2" id="bArcs" data-i18n-title="tb.arcs.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 16a8 8 0 0 1 16 0M6 16a4 4 0 0 1 8 0"/></svg><span class="tl opt" data-i18n="tb.arcs"></span></button>
      <button class="tb sec2" id="bLbl" data-i18n-title="tb.labels.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h12M10 5v11M7 16h6"/></svg><span class="tl opt" data-i18n="tb.labels"></span></button>
      <span class="tsep sec2"></span>
      <button class="tb sec2" id="bPng" data-i18n-title="tb.png.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 4h14v12H3z"/><path d="m3 13 4-4 4 4 2-2 4 4"/></svg><span class="tl">PNG</span></button>
      <button class="tb sec2" id="bSvg" data-i18n-title="tb.svg.t"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 16 16 4M4 4h5M11 16h5"/><circle cx="4" cy="16" r="1.5"/><circle cx="16" cy="4" r="1.5"/></svg><span class="tl">SVG</span></button>

"form.windEnsemble.n":"Wind ensemble (Fennell model)","form.windEnsemble.d":"One player per part, doubling only in the clarinets: the flexible instrumentation of the Eastman Wind Ensemble.",
"form.italianBand.n":"Italian concert band","form.italianBand.d":"Instrumentation with the full flugelhorn family (soprano, alto, tenor, baritone, bass), following the Italian band tradition.",
"form.youthBand.n":"Youth or school band","form.youthBand.d":"Reduced, flexible instrumentation typical of school music programmes and youth bands.",
"form.harmonie.n":"Harmoniemusik (wind octet)","form.harmonie.d":"Two oboes, two clarinets, two bassoons, two horns and contrabassoon: the classical repertoire of Mozart, Beethoven, Krommer.",
"form.brassPerc.n":"Brass and percussion ensemble","form.brassPerc.d":"Symphonic brass section with timpani and percussion: fanfares, intradas, ceremonial repertoire.",
"form.brassBand.n":"British brass band","form.brassBand.d":"Standard 25-piece brass line-up: cornets, flugelhorn, tenor horns, baritones, euphoniums, trombones and basses, plus percussion.",
"form.fanfare.n":"Fanfare band (saxes and brass)","form.fanfare.d":"Saxophones, flugelhorns and brass without flutes or clarinets, on the model of the Dutch and Belgian fanfare.",
"lay.concentric.n":"Concert band in concentric semicircles",
"lay.concentric.d":"High woodwinds in the front row (flutes on the conductor’s left, first clarinets on the right), clarinets, low reeds and saxes in the middle rows, horns in the centre, brass at the back and percussion behind. The most common layout in school and university concert bands.",
"lay.concentric.use":"Medium and large ensembles, stages at least 9–10 m deep.",
"lay.concentric.refs":["William D. Revelli, articles on concert band organisation and seating in “The Instrumentalist” (1950s–1970s).","Richard Franko Goldman, The Concert Band, Rinehart, New York 1946.","Richard Miles (ed.), Teaching Music through Performance in Band, vol. 1, GIA Publications, Chicago 1997."],
"lay.fennell.n":"Wind ensemble by choirs (Fennell)",
"lay.fennell.d":"Woodwinds take the first two rows grouped by family; brass the back rows, with horns on the left and trumpets, trombones and tubas on the right. Designed for one player per part, it favours chamber-like clarity and mutual listening between soloists.",
"lay.fennell.use":"Wind ensembles, one-per-part instrumentation, 20th-century and contemporary repertoire.",
"lay.fennell.refs":["Frederick Fennell, Time and the Winds, G. Leblanc Co., Kenosha 1954.","Frank L. Battisti, The Winds of Change: The Evolution of the Contemporary American Wind Band/Ensemble and its Conductor, Meredith Music, Galesville 2002.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.italian.n":"Italian band with flugelhorns",
"lay.italian.d":"Clarinets and woodwinds in the front rows on the left, saxes on the right; in the third band soprano and alto flugelhorns with trumpets and horns, at the back tenor and baritone flugelhorns, trombones and basses. It reflects the band instrumentation codified in Italy in the 19th and 20th centuries.",
"lay.italian.use":"Italian town and civic bands, ensembles with flugelhorns.",
"lay.italian.refs":["Alessandro Vessella, La banda dalle origini fino ai nostri giorni, Istituto Editoriale Nazionale, Milan 1935.","ANBIMA teaching materials and band competition rules (Italian practice of instrumentation and seating)."],
"lay.harmonie.n":"European harmonie (clarinets on the left)",
"lay.harmonie.d":"The clarinet block takes the whole left side, like the strings in an orchestra; flutes and oboes in the centre, saxes on the right; brass in the last two bands with the basses in the centre. Common in Dutch, Belgian, German and Swiss harmonie orchestras.",
"lay.harmonie.use":"Ensembles with many clarinets, symphonic transcription repertoire.",
"lay.harmonie.refs":["Richard Franko Goldman, The Wind Band: Its Literature and Technique, Allyn and Bacon, Boston 1961.","Frank L. Battisti, The Winds of Change, Meredith Music, 2002 (chapters on the European tradition)."],
"lay.sectors.n":"Sectors by family (wedges)",
"lay.sectors.d":"Each family takes a wedge running from the first to the last row, with the principal players towards the conductor. Sections stay compact and each one reaches the audience from a clear direction.",
"lay.sectors.use":"Fanfare bands, brass ensembles, homogeneous groups and wide but shallow stages.",
"lay.sectors.refs":["Elizabeth A. H. Green, The Modern Conductor, Prentice Hall (several editions), chapter on seating.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.chamber.n":"Single semicircle (chamber)",
"lay.chamber.d":"Everyone on one arc (or two, if the group does not fit), in the traditional order of wind groups: oboes and clarinets on the outside, horns and bassoons towards the centre and the right.",
"lay.chamber.use":"Harmoniemusik, quintets and small groups of up to 12–14 players.",
"lay.chamber.refs":["Roger Hellyer, Harmoniemusik: Music for Small Wind Band in the Late Eighteenth and Early Nineteenth Centuries, doctoral thesis, University of Oxford, 1973."],
"lay.brassBand.n":"British brass band (open square)",
"lay.brassBand.d":"Solo cornets front left, tenor horns in the centre, euphoniums front right; behind them rank cornets, flugelhorn, baritones and trombones; the basses close the back. The classic open square is drawn here as three shallow arcs.",
"lay.brassBand.use":"Brass bands and all-brass groups with many cornets.",
"lay.brassBand.refs":["Roy Newsome, Brass Roots: A Hundred Years of Brass Bands and Their Music, 1836–1936, Ashgate, Aldershot 1998.","Rules and practice of the British championships (British Open, National Championships)."],
"lay.blocks.n":"Straight rows in blocks",
"lay.blocks.d":"The same section distribution as the concert band, but on straight rows parallel to the stage front. It makes the most of narrow, shallow rectangular stages, modular risers and outdoor spaces.",
"lay.blocks.use":"Outdoor stages, marquees, rehearsal rooms, concerts on straight risers.",
"lay.blocks.refs":["Wenger Corporation, Planning Guide for School Music Facilities (area per musician and use of risers).","Staging practice for modular stages and outdoor concerts."]

"form.italianBand.n":"Banda da concerto all’italiana","form.italianBand.d":"Organico con la famiglia completa dei flicorni (soprano, contralto, tenore, baritono, basso), secondo la tradizione bandistica italiana.",

"form.brassBand.n":"Brass band britannica","form.brassBand.d":"Organico standard di 25 ottoni: cornette, flicorno, tenor horn, baritoni, euphonium, tromboni e bassi, più percussioni.",
"form.fanfare.n":"Fanfara (sax e ottoni)","form.fanfare.d":"Sax, flicorni e ottoni senza flauti e clarinetti, sul modello della fanfare olandese e belga.",
"lay.concentric.n":"Concert band a semicerchi concentrici",
"lay.concentric.d":"Legni acuti in prima fila (flauti alla sinistra del direttore, clarinetti I alla destra), clarinetti, ance gravi e sax nelle file centrali, corni al centro, ottoni sul fondo e percussioni dietro. È la disposizione più diffusa nelle concert band scolastiche e universitarie.",
"lay.concentric.use":"Organici medi e grandi, palchi profondi almeno 9–10 m.",
"lay.concentric.refs":["William D. Revelli, articoli sull’organizzazione e la disposizione della concert band apparsi su “The Instrumentalist” (anni ’50–’70).","Richard Franko Goldman, The Concert Band, Rinehart, New York 1946.","Richard Miles (a cura di), Teaching Music through Performance in Band, vol. 1, GIA Publications, Chicago 1997."],
"lay.fennell.n":"Wind ensemble per cori (Fennell)",
"lay.fennell.d":"I legni occupano le prime due file divisi per famiglia, gli ottoni le file posteriori con corni a sinistra e trombe, tromboni e tube a destra. Pensata per una parte per leggio, privilegia la trasparenza cameristica e l’ascolto reciproco tra solisti.",
"lay.fennell.use":"Wind ensemble, organici a parti reali, repertorio del Novecento e contemporaneo.",
"lay.fennell.refs":["Frederick Fennell, Time and the Winds, G. Leblanc Co., Kenosha 1954.","Frank L. Battisti, The Winds of Change: The Evolution of the Contemporary American Wind Band/Ensemble and its Conductor, Meredith Music, Galesville 2002.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.italian.n":"Banda all’italiana con flicorni",
"lay.italian.d":"Clarinetti e legni sulle prime file a sinistra, sax a destra; nella terza fascia flicorni soprani e contralti con trombe e corni, sul fondo flicorni tenori e baritoni, tromboni e bassi. Rispecchia l’organico bandistico codificato in Italia tra Otto e Novecento.",
"lay.italian.use":"Bande cittadine e musicali italiane, organici con flicorni.",
"lay.italian.refs":["Alessandro Vessella, La banda dalle origini fino ai nostri giorni, Istituto Editoriale Nazionale, Milano 1935.","Materiali didattici e regolamenti dei concorsi bandistici ANBIMA (prassi italiana di organico e disposizione)."],
"lay.harmonie.n":"Harmonie europea (clarinetti a sinistra)",
"lay.harmonie.d":"Il blocco dei clarinetti occupa tutta la sinistra, come gli archi in orchestra; flauti e oboi al centro, sax a destra; ottoni nelle ultime due fasce con i bassi al centro. Diffusa nelle harmonie olandesi, belghe, tedesche e svizzere.",
"lay.harmonie.use":"Organici con molti clarinetti, repertorio di trascrizione sinfonica.",
"lay.harmonie.refs":["Richard Franko Goldman, The Wind Band: Its Literature and Technique, Allyn and Bacon, Boston 1961.","Frank L. Battisti, The Winds of Change, Meredith Music, 2002 (parti sulla tradizione europea)."],
"lay.sectors.n":"Settori per famiglie (a spicchio)",
"lay.sectors.d":"Ogni famiglia occupa uno spicchio che va dalla prima all’ultima fila, con le prime parti verso il direttore. Le sezioni restano compatte e il suono di ciascuna arriva al pubblico da una direzione precisa.",
"lay.sectors.use":"Fanfare, ensemble di ottoni, organici omogenei e palchi larghi ma poco profondi.",
"lay.sectors.refs":["Elizabeth A. H. Green, The Modern Conductor, Prentice Hall (diverse edizioni), capitolo sulla disposizione dell’organico.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.chamber.n":"Semicerchio unico (cameristico)",
"lay.chamber.d":"Tutti su un solo arco (o su due, se l’organico non ci sta), nell’ordine tradizionale dei gruppi di fiati: oboi e clarinetti all’esterno, corni e fagotti verso il centro e la destra.",
"lay.chamber.use":"Harmoniemusik, quintetti e piccoli gruppi fino a 12–14 elementi.",
"lay.chamber.refs":["Roger Hellyer, Harmoniemusik: Music for Small Wind Band in the Late Eighteenth and Early Nineteenth Centuries, tesi di dottorato, University of Oxford, 1973."],
"lay.brassBand.n":"Brass band britannica (quadrato aperto)",
"lay.brassBand.d":"Cornette soliste davanti a sinistra, tenor horn al centro, euphonium davanti a destra; dietro cornette di fila, flicorno, baritoni e tromboni; i bassi chiudono sul fondo. Qui il classico quadrato aperto è reso con tre archi poco profondi.",
"lay.brassBand.use":"Brass band e organici di soli ottoni con molte cornette.",
"lay.brassBand.refs":["Roy Newsome, Brass Roots: A Hundred Years of Brass Bands and Their Music, 1836–1936, Ashgate, Aldershot 1998.","Regolamenti e prassi dei campionati britannici (British Open, National Championships)."],
"lay.blocks.n":"File rettilinee a blocchi",
"lay.blocks.d":"Stessa distribuzione per sezioni della concert band, ma su file diritte parallele al proscenio. Sfrutta palchi rettangolari stretti e poco profondi, pedane modulari e spazi all’aperto.",
"lay.blocks.use":"Palchi all’aperto, tensostrutture, sale prove, concerti con pedane rettilinee.",
"lay.blocks.refs":["Wenger Corporation, Planning Guide for School Music Facilities (superfici per musicista e uso delle pedane).","Prassi organizzativa per palchi modulari e concerti all’aperto."]

"lay.concentric.n":"Banda en semicírculos concéntricos",
"lay.concentric.d":"Maderas agudas en primera fila (flautas a la izquierda del director, primeros clarinetes a la derecha), clarinetes, lengüetas graves y saxos en las filas centrales, trompas en el centro, metales al fondo y percusión detrás. Es la disposición más extendida en las bandas escolares y universitarias.",

"lay.concentric.refs":["William D. Revelli, artículos sobre organización y disposición de la banda en «The Instrumentalist» (décadas de 1950 a 1970).","Richard Franko Goldman, The Concert Band, Rinehart, Nueva York 1946.","Richard Miles (ed.), Teaching Music through Performance in Band, vol. 1, GIA Publications, Chicago 1997."],
"lay.fennell.n":"Wind ensemble por coros (Fennell)",
"lay.fennell.d":"Las maderas ocupan las dos primeras filas agrupadas por familia; los metales, las filas traseras, con las trompas a la izquierda y trompetas, trombones y tubas a la derecha. Pensada para un músico por parte, favorece la claridad camerística y la escucha mutua entre solistas.",
"lay.fennell.use":"Wind ensembles, plantillas a partes reales, repertorio del siglo XX y contemporáneo.",
"lay.fennell.refs":["Frederick Fennell, Time and the Winds, G. Leblanc Co., Kenosha 1954.","Frank L. Battisti, The Winds of Change: The Evolution of the Contemporary American Wind Band/Ensemble and its Conductor, Meredith Music, Galesville 2002.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.italian.n":"Banda italiana con fliscornos",
"lay.italian.d":"Clarinetes y maderas en las primeras filas a la izquierda, saxos a la derecha; en la tercera franja fliscornos sopranos y altos con trompetas y trompas, al fondo fliscornos tenores y barítonos, trombones y bajos. Refleja la plantilla bandística codificada en Italia en los siglos XIX y XX.",
"lay.italian.use":"Bandas municipales italianas, plantillas con fliscornos.",
"lay.italian.refs":["Alessandro Vessella, La banda dalle origini fino ai nostri giorni, Istituto Editoriale Nazionale, Milán 1935.","Materiales didácticos y reglamentos de concursos de bandas de ANBIMA (práctica italiana de plantilla y disposición)."],
"lay.harmonie.n":"Harmonie europea (clarinetes a la izquierda)",
"lay.harmonie.d":"El bloque de clarinetes ocupa toda la izquierda, como la cuerda en la orquesta; flautas y oboes en el centro, saxos a la derecha; metales en las dos últimas franjas con los bajos en el centro. Habitual en las harmonies neerlandesas, belgas, alemanas y suizas.",
"lay.harmonie.use":"Plantillas con muchos clarinetes, repertorio de transcripción sinfónica.",
"lay.harmonie.refs":["Richard Franko Goldman, The Wind Band: Its Literature and Technique, Allyn and Bacon, Boston 1961.","Frank L. Battisti, The Winds of Change, Meredith Music, 2002 (capítulos sobre la tradición europea)."],
"lay.sectors.n":"Sectores por familias (en cuña)",
"lay.sectors.d":"Cada familia ocupa una cuña que va de la primera a la última fila, con los solistas hacia el director. Las secciones quedan compactas y cada una llega al público desde una dirección clara.",
"lay.sectors.use":"Fanfarrias, conjuntos de metales, plantillas homogéneas y escenarios anchos pero poco profundos.",
"lay.sectors.refs":["Elizabeth A. H. Green, The Modern Conductor, Prentice Hall (varias ediciones), capítulo sobre la disposición.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.chamber.n":"Semicírculo único (de cámara)",
"lay.chamber.d":"Todos en un solo arco (o en dos, si no caben), en el orden tradicional de los grupos de viento: oboes y clarinetes en el exterior, trompas y fagotes hacia el centro y la derecha.",
"lay.chamber.use":"Harmoniemusik, quintetos y grupos pequeños de hasta 12–14 músicos.",
"lay.chamber.refs":["Roger Hellyer, Harmoniemusik: Music for Small Wind Band in the Late Eighteenth and Early Nineteenth Centuries, tesis doctoral, University of Oxford, 1973."],
"lay.brassBand.n":"Brass band británica (cuadrado abierto)",
"lay.brassBand.d":"Cornetas solistas delante a la izquierda, tenor horns en el centro, bombardinos delante a la derecha; detrás cornetas de fila, fliscorno, barítonos y trombones; los bajos cierran al fondo. El clásico cuadrado abierto se representa aquí con tres arcos poco profundos.",
"lay.brassBand.use":"Brass bands y conjuntos solo de metales con muchas cornetas.",
"lay.brassBand.refs":["Roy Newsome, Brass Roots: A Hundred Years of Brass Bands and Their Music, 1836–1936, Ashgate, Aldershot 1998.","Reglamentos y práctica de los campeonatos británicos (British Open, National Championships)."],
"lay.blocks.n":"Filas rectas en bloques",
"lay.blocks.d":"La misma distribución por secciones de la banda de concierto, pero en filas rectas paralelas al proscenio. Aprovecha escenarios rectangulares estrechos y poco profundos, tarimas modulares y espacios al aire libre.",
"lay.blocks.use":"Escenarios al aire libre, carpas, salas de ensayo, conciertos con tarimas rectas.",
"lay.blocks.refs":["Wenger Corporation, Planning Guide for School Music Facilities (superficie por músico y uso de tarimas).","Práctica de montaje para escenarios modulares y conciertos al aire libre."]

"form.symphonic.n":"Orchestre d’harmonie symphonique","form.symphonic.d":"Effectif de concert complet avec flûtes et clarinettes doublées, cuivres et percussions au complet.",
"form.windEnsemble.n":"Wind ensemble (modèle Fennell)","form.windEnsemble.d":"Un musicien par partie, doublures seulement aux clarinettes : l’effectif modulable de l’Eastman Wind Ensemble.",
"form.italianBand.n":"Harmonie de concert à l’italienne","form.italianBand.d":"Effectif avec la famille complète des bugles (soprano, alto, ténor, baryton, basse), selon la tradition des bandes italiennes.",
"form.youthBand.n":"Orchestre d’harmonie junior ou scolaire","form.youthBand.d":"Effectif réduit et modulable, typique des écoles de musique et des orchestres de jeunes.",
"form.harmonie.n":"Harmoniemusik (octuor à vent)","form.harmonie.d":"Deux hautbois, deux clarinettes, deux bassons, deux cors et contrebasson : le répertoire classique de Mozart, Beethoven, Krommer.",
"form.brassPerc.n":"Ensemble de cuivres et percussions","form.brassPerc.d":"Pupitre de cuivres symphonique avec timbales et percussions : fanfares, intradas, répertoire de cérémonie.",
"form.brassBand.n":"Brass band britannique","form.brassBand.d":"Effectif standard de 25 cuivres : cornets, bugle, saxhorns altos, barytons, euphoniums, trombones et basses, plus percussions.",
"form.fanfare.n":"Fanfare (saxophones et cuivres)","form.fanfare.d":"Saxophones, bugles et cuivres sans flûtes ni clarinettes, sur le modèle de la fanfare néerlandaise et belge.",
"lay.concentric.n":"Orchestre d’harmonie en demi-cercles concentriques",
"lay.concentric.d":"Bois aigus au premier rang (flûtes à gauche du chef, premières clarinettes à droite), clarinettes, anches graves et saxophones aux rangs centraux, cors au centre, cuivres au fond et percussions derrière. C’est le placement le plus répandu dans les orchestres scolaires et universitaires.",
"lay.concentric.use":"Effectifs moyens et grands, scènes d’au moins 9–10 m de profondeur.",
"lay.concentric.refs":["William D. Revelli, articles sur l’organisation et le placement de l’orchestre d’harmonie parus dans « The Instrumentalist » (années 1950–1970).","Richard Franko Goldman, The Concert Band, Rinehart, New York 1946.","Richard Miles (dir.), Teaching Music through Performance in Band, vol. 1, GIA Publications, Chicago 1997."],
"lay.fennell.n":"Wind ensemble par chœurs (Fennell)",
"lay.fennell.d":"Les bois occupent les deux premiers rangs, groupés par famille ; les cuivres les rangs arrière, avec les cors à gauche et trompettes, trombones et tubas à droite. Conçu pour un musicien par partie, il privilégie la clarté chambriste et l’écoute mutuelle entre solistes.",
"lay.fennell.use":"Wind ensembles, effectifs à parties réelles, répertoire du XXe siècle et contemporain.",
"lay.fennell.refs":["Frederick Fennell, Time and the Winds, G. Leblanc Co., Kenosha 1954.","Frank L. Battisti, The Winds of Change: The Evolution of the Contemporary American Wind Band/Ensemble and its Conductor, Meredith Music, Galesville 2002.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.italian.n":"Banda italienne avec bugles",
"lay.italian.d":"Clarinettes et bois aux premiers rangs à gauche, saxophones à droite ; dans la troisième bande bugles sopranos et altos avec trompettes et cors, au fond bugles ténors et barytons, trombones et basses. Il reflète l’effectif de banda codifié en Italie aux XIXe et XXe siècles.",
"lay.italian.use":"Bandas municipales italiennes, effectifs avec bugles.",
"lay.italian.refs":["Alessandro Vessella, La banda dalle origini fino ai nostri giorni, Istituto Editoriale Nazionale, Milan 1935.","Supports pédagogiques et règlements des concours de l’ANBIMA (pratique italienne d’effectif et de placement)."],
"lay.harmonie.n":"Harmonie européenne (clarinettes à gauche)",
"lay.harmonie.d":"Le bloc des clarinettes occupe toute la gauche, comme les cordes à l’orchestre ; flûtes et hautbois au centre, saxophones à droite ; cuivres dans les deux dernières bandes avec les basses au centre. Répandu dans les harmonies néerlandaises, belges, allemandes et suisses.",
"lay.harmonie.use":"Effectifs avec beaucoup de clarinettes, répertoire de transcriptions symphoniques.",
"lay.harmonie.refs":["Richard Franko Goldman, The Wind Band: Its Literature and Technique, Allyn and Bacon, Boston 1961.","Frank L. Battisti, The Winds of Change, Meredith Music, 2002 (chapitres sur la tradition européenne)."],
"lay.sectors.n":"Secteurs par familles (en coins)",
"lay.sectors.d":"Chaque famille occupe un secteur qui va du premier au dernier rang, les solistes vers le chef. Les pupitres restent compacts et chacun atteint le public depuis une direction précise.",
"lay.sectors.use":"Fanfares, ensembles de cuivres, effectifs homogènes et scènes larges mais peu profondes.",
"lay.sectors.refs":["Elizabeth A. H. Green, The Modern Conductor, Prentice Hall (plusieurs éditions), chapitre sur le placement.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.chamber.n":"Demi-cercle unique (de chambre)",
"lay.chamber.d":"Tout le monde sur un seul arc (ou deux si l’effectif ne tient pas), dans l’ordre traditionnel des ensembles à vent : hautbois et clarinettes à l’extérieur, cors et bassons vers le centre et la droite.",
"lay.chamber.use":"Harmoniemusik, quintettes et petits ensembles jusqu’à 12–14 musiciens.",
"lay.chamber.refs":["Roger Hellyer, Harmoniemusik: Music for Small Wind Band in the Late Eighteenth and Early Nineteenth Centuries, thèse de doctorat, University of Oxford, 1973."],
"lay.brassBand.n":"Brass band britannique (carré ouvert)",
"lay.brassBand.d":"Cornets solos devant à gauche, saxhorns altos au centre, euphoniums devant à droite ; derrière, cornets de rang, bugle, barytons et trombones ; les basses ferment le fond. Le carré ouvert classique est représenté ici par trois arcs peu profonds.",
"lay.brassBand.use":"Brass bands et ensembles de cuivres seuls avec beaucoup de cornets.",
"lay.brassBand.refs":["Roy Newsome, Brass Roots: A Hundred Years of Brass Bands and Their Music, 1836–1936, Ashgate, Aldershot 1998.","Règlements et pratique des championnats britanniques (British Open, National Championships)."],
"lay.blocks.n":"Rangs droits en blocs",
"lay.blocks.d":"La même répartition par pupitres que l’orchestre d’harmonie, mais sur des rangs droits parallèles à l’avant-scène. Idéal pour les scènes rectangulaires étroites et peu profondes, les praticables modulaires et le plein air.",
"lay.blocks.use":"Scènes extérieures, chapiteaux, salles de répétition, concerts sur praticables droits.",
"lay.blocks.refs":["Wenger Corporation, Planning Guide for School Music Facilities (surface par musicien et usage des praticables).","Pratique de montage pour scènes modulaires et concerts en plein air."]

"form.symphonic.n":"Sinfonisches Blasorchester","form.symphonic.d":"Vollständige Konzertbesetzung mit doppelt besetzten Flöten und Klarinetten, kompletten Blechbläsern und Schlagwerk.",
"form.windEnsemble.n":"Wind Ensemble (Modell Fennell)","form.windEnsemble.d":"Ein Spieler pro Stimme, Verdopplung nur bei den Klarinetten: die flexible Besetzung des Eastman Wind Ensemble.",
"form.italianBand.n":"Italienische Konzertbanda","form.italianBand.d":"Besetzung mit der vollständigen Flügelhornfamilie (Sopran, Alt, Tenor, Bariton, Bass) nach italienischer Banda-Tradition.",
"form.youthBand.n":"Jugend- oder Schulorchester","form.youthBand.d":"Kleinere, flexible Besetzung, typisch für Musikschulen, Bläserklassen und Jugendkapellen.",
"form.harmonie.n":"Harmoniemusik (Bläseroktett)","form.harmonie.d":"Zwei Oboen, zwei Klarinetten, zwei Fagotte, zwei Hörner und Kontrafagott: das klassische Repertoire von Mozart, Beethoven, Krommer.",
"form.brassPerc.n":"Blechbläser- und Schlagwerkensemble","form.brassPerc.d":"Sinfonischer Blechbläsersatz mit Pauken und Schlagwerk: Fanfaren, Intraden, festliches Repertoire.",
"form.brassBand.n":"Britische Brass Band","form.brassBand.d":"Standardbesetzung mit 25 Blechbläsern: Kornette, Flügelhorn, Althörner, Baritone, Euphonien, Posaunen und Bässe, dazu Schlagwerk.",
"form.fanfare.n":"Fanfare (Saxophone und Blech)","form.fanfare.d":"Saxophone, Flügelhörner und Blechbläser ohne Flöten und Klarinetten, nach dem Vorbild der niederländischen und belgischen Fanfare.",
"lay.concentric.n":"Blasorchester in konzentrischen Halbkreisen",
"lay.concentric.d":"Hohe Holzbläser in der ersten Reihe (Flöten links vom Dirigenten, erste Klarinetten rechts), Klarinetten, tiefe Rohrblätter und Saxophone in den mittleren Reihen, Hörner in der Mitte, Blech hinten und Schlagwerk dahinter. Die verbreitetste Aufstellung in Schul- und Hochschulorchestern.",
"lay.concentric.use":"Mittlere und große Besetzungen, Bühnen mit mindestens 9–10 m Tiefe.",
"lay.concentric.refs":["William D. Revelli, Artikel zu Organisation und Aufstellung des Blasorchesters in „The Instrumentalist“ (1950er–1970er Jahre).","Richard Franko Goldman, The Concert Band, Rinehart, New York 1946.","Richard Miles (Hrsg.), Teaching Music through Performance in Band, Bd. 1, GIA Publications, Chicago 1997."],
"lay.fennell.n":"Wind Ensemble nach Chören (Fennell)",
"lay.fennell.d":"Die Holzbläser besetzen die ersten beiden Reihen nach Familien, das Blech die hinteren Reihen mit den Hörnern links und Trompeten, Posaunen und Tuben rechts. Für einen Spieler pro Stimme gedacht, fördert sie kammermusikalische Transparenz und das gegenseitige Hören der Solisten.",
"lay.fennell.use":"Wind Ensembles, solistische Besetzungen, Repertoire des 20. Jahrhunderts und zeitgenössische Musik.",
"lay.fennell.refs":["Frederick Fennell, Time and the Winds, G. Leblanc Co., Kenosha 1954.","Frank L. Battisti, The Winds of Change: The Evolution of the Contemporary American Wind Band/Ensemble and its Conductor, Meredith Music, Galesville 2002.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.italian.n":"Italienische Banda mit Flügelhörnern",
"lay.italian.d":"Klarinetten und Holzbläser vorne links, Saxophone rechts; in der dritten Zone Sopran- und Altflügelhörner mit Trompeten und Hörnern, hinten Tenor- und Baritonflügelhörner, Posaunen und Bässe. Sie spiegelt die im 19. und 20. Jahrhundert in Italien festgelegte Banda-Besetzung wider.",
"lay.italian.use":"Italienische Stadt- und Gemeindebandas, Besetzungen mit Flügelhörnern.",
"lay.italian.refs":["Alessandro Vessella, La banda dalle origini fino ai nostri giorni, Istituto Editoriale Nazionale, Mailand 1935.","Unterrichtsmaterialien und Wettbewerbsordnungen der ANBIMA (italienische Praxis zu Besetzung und Aufstellung)."],
"lay.harmonie.n":"Europäische Harmonie (Klarinetten links)",
"lay.harmonie.d":"Der Klarinettenblock nimmt die ganze linke Seite ein, wie die Streicher im Orchester; Flöten und Oboen in der Mitte, Saxophone rechts; Blech in den beiden letzten Zonen mit den Bässen in der Mitte. Verbreitet in niederländischen, belgischen, deutschen und Schweizer Harmonieorchestern.",
"lay.harmonie.use":"Besetzungen mit vielen Klarinetten, sinfonisches Bearbeitungsrepertoire.",
"lay.harmonie.refs":["Richard Franko Goldman, The Wind Band: Its Literature and Technique, Allyn and Bacon, Boston 1961.","Frank L. Battisti, The Winds of Change, Meredith Music, 2002 (Kapitel zur europäischen Tradition)."],
"lay.sectors.n":"Sektoren nach Familien (Keile)",
"lay.sectors.d":"Jede Familie belegt einen Keil von der ersten bis zur letzten Reihe, die Stimmführer zum Dirigenten hin. Die Register bleiben geschlossen, und jedes erreicht das Publikum aus einer klaren Richtung.",
"lay.sectors.use":"Fanfaren, Blechbläserensembles, homogene Besetzungen und breite, aber flache Bühnen.",
"lay.sectors.refs":["Elizabeth A. H. Green, The Modern Conductor, Prentice Hall (mehrere Auflagen), Kapitel zur Aufstellung.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.chamber.n":"Einzelner Halbkreis (kammermusikalisch)",
"lay.chamber.d":"Alle auf einem Bogen (oder zwei, wenn die Besetzung nicht passt), in der traditionellen Reihenfolge der Bläserensembles: Oboen und Klarinetten außen, Hörner und Fagotte zur Mitte und nach rechts.",
"lay.chamber.use":"Harmoniemusik, Quintette und kleine Ensembles bis 12–14 Spieler.",
"lay.chamber.refs":["Roger Hellyer, Harmoniemusik: Music for Small Wind Band in the Late Eighteenth and Early Nineteenth Centuries, Dissertation, University of Oxford, 1973."],
"lay.brassBand.n":"Britische Brass Band (offenes Quadrat)",
"lay.brassBand.d":"Solokornette vorne links, Althörner in der Mitte, Euphonien vorne rechts; dahinter Tutti-Kornette, Flügelhorn, Baritone und Posaunen; die Bässe schließen hinten ab. Das klassische offene Quadrat wird hier mit drei flachen Bögen dargestellt.",
"lay.brassBand.use":"Brass Bands und reine Blechbläserbesetzungen mit vielen Kornetten.",
"lay.brassBand.refs":["Roy Newsome, Brass Roots: A Hundred Years of Brass Bands and Their Music, 1836–1936, Ashgate, Aldershot 1998.","Regeln und Praxis der britischen Meisterschaften (British Open, National Championships)."],
"lay.blocks.n":"Gerade Reihen in Blöcken",
"lay.blocks.d":"Die gleiche Registerverteilung wie beim Blasorchester, aber auf geraden Reihen parallel zur Bühnenrampe. Nutzt schmale, flache Rechteckbühnen, modulare Podeste und Freiluftorte optimal.",
"lay.blocks.use":"Freilichtbühnen, Festzelte, Probenräume, Konzerte auf geraden Podesten.",
"lay.blocks.refs":["Wenger Corporation, Planning Guide for School Music Facilities (Fläche pro Musiker und Einsatz von Podesten).","Aufbaupraxis für modulare Bühnen und Freiluftkonzerte."]
};

"lay.concentric.n":"Banda em semicírculos concêntricos",
"lay.concentric.d":"Madeiras agudas na primeira fileira (flautas à esquerda do regente, primeiros clarinetes à direita), clarinetes, palhetas graves e saxofones nas fileiras centrais, trompas no centro, metais ao fundo e percussão atrás. É a disposição mais comum nas bandas escolares e universitárias.",
"lay.concentric.use":"Formações médias e grandes, palcos com pelo menos 9–10 m de profundidade.",
"lay.concentric.refs":["William D. Revelli, artigos sobre organização e disposição da banda publicados em “The Instrumentalist” (décadas de 1950 a 1970).","Richard Franko Goldman, The Concert Band, Rinehart, Nova York 1946.","Richard Miles (org.), Teaching Music through Performance in Band, vol. 1, GIA Publications, Chicago 1997."],
"lay.fennell.n":"Wind ensemble por coros (Fennell)",
"lay.fennell.d":"As madeiras ocupam as duas primeiras fileiras agrupadas por família; os metais, as fileiras de trás, com as trompas à esquerda e trompetes, trombones e tubas à direita. Pensada para um músico por parte, favorece a clareza camerística e a escuta mútua entre solistas.",
"lay.fennell.use":"Wind ensembles, formações a partes reais, repertório do século XX e contemporâneo.",
"lay.fennell.refs":["Frederick Fennell, Time and the Winds, G. Leblanc Co., Kenosha 1954.","Frank L. Battisti, The Winds of Change: The Evolution of the Contemporary American Wind Band/Ensemble and its Conductor, Meredith Music, Galesville 2002.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.italian.n":"Banda italiana com flugelhorns",
"lay.italian.d":"Clarinetes e madeiras nas primeiras fileiras à esquerda, saxofones à direita; na terceira faixa flugelhorns sopranos e altos com trompetes e trompas, ao fundo flugelhorns tenores e barítonos, trombones e baixos. Reflete a formação de banda codificada na Itália nos séculos XIX e XX.",
"lay.italian.use":"Bandas municipais italianas, formações com flugelhorns.",
"lay.italian.refs":["Alessandro Vessella, La banda dalle origini fino ai nostri giorni, Istituto Editoriale Nazionale, Milão 1935.","Materiais didáticos e regulamentos de concursos de bandas da ANBIMA (prática italiana de formação e disposição)."],
"lay.harmonie.n":"Harmonie europeia (clarinetes à esquerda)",
"lay.harmonie.d":"O bloco de clarinetes ocupa todo o lado esquerdo, como as cordas na orquestra; flautas e oboés no centro, saxofones à direita; metais nas duas últimas faixas com os baixos no centro. Comum nas harmonies holandesas, belgas, alemãs e suíças.",
"lay.harmonie.use":"Formações com muitos clarinetes, repertório de transcrições sinfônicas.",
"lay.harmonie.refs":["Richard Franko Goldman, The Wind Band: Its Literature and Technique, Allyn and Bacon, Boston 1961.","Frank L. Battisti, The Winds of Change, Meredith Music, 2002 (capítulos sobre a tradição europeia)."],
"lay.sectors.n":"Setores por famílias (em cunha)",
"lay.sectors.d":"Cada família ocupa uma cunha que vai da primeira à última fileira, com os solistas voltados para o regente. Os naipes ficam compactos e cada um chega ao público de uma direção clara.",
"lay.sectors.use":"Fanfarras, conjuntos de metais, formações homogêneas e palcos largos mas rasos.",
"lay.sectors.refs":["Elizabeth A. H. Green, The Modern Conductor, Prentice Hall (várias edições), capítulo sobre a disposição.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.chamber.n":"Semicírculo único (camerístico)",
"lay.chamber.d":"Todos num só arco (ou em dois, se a formação não couber), na ordem tradicional dos grupos de sopros: oboés e clarinetes por fora, trompas e fagotes em direção ao centro e à direita.",
"lay.chamber.use":"Harmoniemusik, quintetos e pequenos grupos de até 12–14 músicos.",
"lay.chamber.refs":["Roger Hellyer, Harmoniemusik: Music for Small Wind Band in the Late Eighteenth and Early Nineteenth Centuries, tese de doutorado, University of Oxford, 1973."],
"lay.brassBand.n":"Brass band britânica (quadrado aberto)",
"lay.brassBand.d":"Cornetas solistas à frente à esquerda, tenor horns no centro, eufônios à frente à direita; atrás cornetas de naipe, flugelhorn, barítonos e trombones; os baixos fecham ao fundo. O clássico quadrado aberto é representado aqui com três arcos rasos.",
"lay.brassBand.use":"Brass bands e grupos só de metais com muitas cornetas.",
"lay.brassBand.refs":["Roy Newsome, Brass Roots: A Hundred Years of Brass Bands and Their Music, 1836–1936, Ashgate, Aldershot 1998.","Regulamentos e prática dos campeonatos britânicos (British Open, National Championships)."],
"lay.blocks.n":"Fileiras retas em blocos",
"lay.blocks.d":"A mesma distribuição por naipes da banda de concerto, mas em fileiras retas paralelas à boca de cena. Aproveita palcos retangulares estreitos e rasos, praticáveis modulares e espaços ao ar livre.",
"lay.blocks.use":"Palcos ao ar livre, tendas, salas de ensaio, concertos com praticáveis retos.",
"lay.blocks.refs":["Wenger Corporation, Planning Guide for School Music Facilities (área por músico e uso de praticáveis).","Prática de montagem para palcos modulares e concertos ao ar livre."]

"form.symphonic.n":"シンフォニック・ウィンドオーケストラ","form.symphonic.d":"フルートとクラリネットを重ね、金管と打楽器もそろえた演奏会用のフル編成。",
"form.windEnsemble.n":"ウィンドアンサンブル（フェネル型）","form.windEnsemble.d":"各パート 1 人、重ねるのはクラリネットのみ。イーストマン・ウィンドアンサンブルの柔軟な編成。",
"form.italianBand.n":"イタリア式コンサートバンド","form.italianBand.d":"ソプラノからバスまでのフリューゲルホルン族をそろえた、イタリアのバンダの伝統的な編成。",
"form.youthBand.n":"ジュニア・学校吹奏楽","form.youthBand.d":"音楽教室やジュニアバンドに多い、小さく柔軟な編成。",
"form.harmonie.n":"ハルモニームジーク（管楽八重奏）","form.harmonie.d":"オーボエ 2、クラリネット 2、ファゴット 2、ホルン 2 とコントラファゴット。モーツァルト、ベートーヴェン、クロンマーの古典派レパートリー。",
"form.brassPerc.n":"金管・打楽器アンサンブル","form.brassPerc.d":"ティンパニと打楽器を加えた管弦楽の金管セクション。ファンファーレ、イントラーダ、式典用レパートリー。",
"form.brassBand.n":"英国式ブラスバンド","form.brassBand.d":"コルネット、フリューゲルホルン、テナーホルン、バリトン、ユーフォニアム、トロンボーン、バスの標準 25 人に打楽器を加えた編成。",
"form.fanfare.n":"ファンファーレオルケスト（サックスと金管）","form.fanfare.d":"フルートとクラリネットを含まない、サックス・フリューゲルホルン・金管の編成。オランダ・ベルギーのファンファーレがモデル。",
"lay.concentric.n":"同心半円のコンサートバンド",
"lay.concentric.d":"最前列に高音木管（指揮者の左にフルート、右に 1st クラリネット）、中央の列にクラリネット・低音リード・サックス、中央にホルン、後方に金管、その奥に打楽器。学校や大学の吹奏楽で最も一般的な配置です。",
"lay.concentric.use":"中〜大編成、奥行き 9〜10 m 以上のステージ。",
"lay.concentric.refs":["William D. Revelli, “The Instrumentalist” 誌に掲載された吹奏楽の組織と配置に関する記事（1950〜70 年代）。","Richard Franko Goldman, The Concert Band, Rinehart, New York 1946.","Richard Miles (ed.), Teaching Music through Performance in Band, vol. 1, GIA Publications, Chicago 1997."],
"lay.fennell.n":"楽器群ごとのウィンドアンサンブル（フェネル）",
"lay.fennell.d":"木管は楽器群ごとに最初の 2 列、金管は後方の列に置き、ホルンを左、トランペット・トロンボーン・テューバを右に配します。各パート 1 人を前提に、室内楽的な透明感とソリスト同士の聴き合いを重視します。",
"lay.fennell.use":"ウィンドアンサンブル、1 パート 1 人の編成、20 世紀・現代のレパートリー。",
"lay.fennell.refs":["Frederick Fennell, Time and the Winds, G. Leblanc Co., Kenosha 1954.","Frank L. Battisti, The Winds of Change: The Evolution of the Contemporary American Wind Band/Ensemble and its Conductor, Meredith Music, Galesville 2002.","Frank L. Battisti, Robert Garofalo, Guide to Score Study for the Wind Band Conductor, Meredith Music, 1990."],
"lay.italian.n":"フリューゲルホルンを含むイタリア式バンダ",
"lay.italian.d":"左側の前列にクラリネットと木管、右側にサックス。3 番目のゾーンにソプラノ・アルトのフリューゲルホルンとトランペット、ホルン。後方にテナー・バリトンのフリューゲルホルン、トロンボーン、バス。19〜20 世紀にイタリアで定まったバンダの編成を反映しています。",
"lay.italian.use":"イタリアの市民バンダ、フリューゲルホルンを含む編成。",
"lay.italian.refs":["Alessandro Vessella, La banda dalle origini fino ai nostri giorni, Istituto Editoriale Nazionale, Milano 1935.","ANBIMA の教材とバンドコンクール規程（イタリアにおける編成と配置の慣習）。"],
"lay.harmonie.n":"ヨーロッパ式ハーモニー（クラリネットを左に）",
"lay.harmonie.d":"オーケストラの弦楽器のように、クラリネット群が左側全体を占めます。中央にフルートとオーボエ、右にサックス、最後の 2 ゾーンに金管を置き、バスを中央に。オランダ、ベルギー、ドイツ、スイスのハーモニーオーケストラで一般的です。",
"lay.harmonie.use":"クラリネットの多い編成、管弦楽編曲のレパートリー。",
"lay.harmonie.refs":["Richard Franko Goldman, The Wind Band: Its Literature and Technique, Allyn and Bacon, Boston 1961.","Frank L. Battisti, The Winds of Change, Meredith Music, 2002（ヨーロッパの伝統に関する章）。"],
"lay.sectors.n":"楽器群ごとの扇形",
"lay.sectors.d":"各楽器群が最前列から最後列まで扇形の区画を占め、首席奏者が指揮者側に座ります。セクションがまとまり、それぞれの音が一定の方向から客席に届きます。",
"lay.sectors.use":"ファンファーレ、金管アンサンブル、均質な編成、幅が広く奥行きの浅いステージ。",

/* ============================== STATE ============================== */
let state = {

  counts:{...DEFAULT_FORMATIONS.symphonic.c},

const inst = k => Object.assign({}, INST[k], state.sizes[k]||{});

/* ============================== GENERATION ============================== */
function angW(m,r){ const I=inst(m.key); return (I.w+.06)/Math.max(.4, r - I.d/2); }

/* Splits the members of a band over several rows, keeping each section in its angular sector. */
function allocate(band,pools,weights){
  const tot = weights.reduce((a,b)=>a+b,0), rows = weights.map(()=>[]), cnt = weights.map(()=>0);
  const N = band.reduce((s,k)=>s+pools[k].length,0), target = weights.map(w=>N*w/tot);
  for(const k of band){
    const list = pools[k], n = list.length;

      fl[bi]++; rem--;

    let idx=0; fl.forEach((c,i)=>{ rows[i].push(...list.slice(idx,idx+c)); idx+=c; cnt[i]+=c; });
  }

}
function placeBand(band,pools,r0,arcs,minRows,spanDeg,gapM){
  const maxSpan = rad(spanDeg);
  const dmax = Math.max(...band.map(k=>inst(k).d));
  const step = dmax + gapM;
  let best=null;
  for(let m=minRows; m<=9; m++){
    const radii = Array.from({length:m},(_,i)=>r0+i*step);
    const rows = allocate(band,pools,radii);
    const need = Math.max(...rows.map((row,i)=>row.length? rowAngle(row,radii[i]) : 0));
    best = {radii,rows,need};
    if(need<=maxSpan) break;
  }
  const span = Math.min(maxSpan, Math.max(rad(46), best.need*1.06));
  let last = r0;
  best.rows.forEach((row,i)=>{
    if(!row.length) return;
    arcs.push({id:uid(), r:r2(best.radii[i]), a0:r2(-deg(span)/2), a1:r2(deg(span)/2), off:0, members:row.map(m=>m.id)});
    last = best.radii[i];
  });
  return last + dmax/2;
}
function placeBlocks(bands,pools){
  const P = state.params, W = state.stage.w, usable = W - 1;
  let yc = state.podium.y - P.r0, prevD = null;
  for(const band of bands){
    let rows;
    for(let m=1;m<=10;m++){
      rows = allocate(band,pools,Array(m).fill(1));
      if(Math.max(...rows.map(r=>r.reduce((s,x)=>s+inst(x.key).w+.08,0))) <= usable) break;
    }
    for(const row of rows){
      if(!row.length) continue;
      const d = Math.max(...row.map(m=>inst(m.key).d));
      if(prevD!==null) yc -= (prevD+d)/2 + P.gap;
      const arc = {id:uid(), shape:"line", x:r2(state.podium.x), y:r2(yc), ang:0, len:r2(row.reduce((s,m)=>s+inst(m.key).w+.1,0)), r:3, a0:-30, a1:30, off:0, members:row.map(m=>m.id)};
      state.arcs.push(arc); layoutArc(arc);

    }

}
/* Percussion along the back wall, starting from the corners; overflow goes to the side walls. */
function placePerc(list,block,frac=1){
  const W = state.stage.w, lim = W*frac/2;
  let y=.3, rowD=0, lx=.3, rx=W-.3, side=false, ly=0, ry=0;
  for(const m of list){
    const I = inst(m.key);
    if(!side && (lx + I.w*1.15 > rx || (frac<1 && Math.min(lx-.3,(W-.3)-rx) + I.w > lim))) { side=true; ly=ry=y+rowD+.3; }
    if(side){
      const left = ly <= ry;
      m.rot = left ? -90 : 90;
      if(left){ m.x = r2(.3 + I.d/2); m.y = r2(ly + I.w/2); ly += I.w + .25; }
      else { m.x = r2(W - .3 - I.d/2); m.y = r2(ry + I.w/2); ry += I.w + .25; }
      m.arc = null; continue;
    }
    const left = (lx-.3) <= ((W-.3)-rx);
    const xc = left ? lx + I.w/2 : rx - I.w/2;
    const rot = block ? 0 : clamp(faceRot(xc, y+I.d/2), -28, 28);
    const c = Math.abs(Math.cos(rad(rot))), s = Math.abs(Math.sin(rad(rot)));
    const hx = I.w/2*c + I.d/2*s, hy = I.w/2*s + I.d/2*c;
    if(left){ m.x = r2(lx+hx); lx += 2*hx + .2; } else { m.x = r2(rx-hx); rx -= 2*hx + .2; }

function generate(){
  const L = getLayout(), P = state.params;
  state.podium = {x:r2(state.stage.w/2), y:r2(state.stage.d - P.front)};
  const pools = {}, musicians = [];
  for(const k of KEYS){
    const n = state.counts[k]|0; if(n<=0) continue;
    pools[k] = [];
    for(let i=1;i<=n;i++){ const m={id:uid(),key:k,num:i,x:0,y:0,rot:0,arc:null}; pools[k].push(m); musicians.push(m); }
  }
  const nonPerc = KEYS.filter(k=>pools[k] && INST[k].f!=="pc");
  const one = L.kind==="wedge"||L.kind==="single";
  const seq = L.order || (L.bands||[]).flat();
  let bands = one ? [seq.filter(k=>pools[k] && k!=="pf" && k!=="arpa")] : (L.bands||[seq]).map(b=>b.filter(k=>pools[k]));
  const used = new Set(bands.flat()); const rest = nonPerc.filter(k=>!used.has(k) && !(one && (k==="pf"||k==="arpa")));
  if(rest.length){ if(one) bands[0].push(...rest); else bands.push(rest); }
  if(one){ const big=["pf","arpa"].filter(k=>pools[k]); if(big.length) bands.push(big); }
  bands = bands.filter(b=>b.length);
  state.musicians = musicians; state.arcs = [];
  const percList = PERC_ORDER.filter(k=>pools[k]).flatMap(k=>pools[k]);
  if(L.kind==="block"){ placeBlocks(bands,pools); placePerc(percList,true); }
  else {
    const N = nonPerc.reduce((s,k)=>s+pools[k].length,0);
    const minRows = L.kind==="wedge" ? (N>=24?3:N>=12?2:1) : 1;
    const s0 = L.span || P.maxSpan;
    const spans = [...new Set([s0, s0+10, s0+20, s0+30].map(v=>Math.min(180,v)))];
    const gaps = [...new Set([P.gap, Math.min(P.gap,.05)])];
    let best=null;
    /* tries several spans, row gaps and percussion arrangements and keeps the one with fewest conflicts */
    outer: for(const pf of [1,.62,.4]) for(const g of gaps) for(const sp of spans){
      state.arcs = [];
      let edge = null;
      for(const band of bands){
        const dm = Math.max(...band.map(k=>inst(k).d));
        edge = placeBand(band,pools, edge===null ? P.r0 : edge + g + dm/2, state.arcs,minRows,sp,g);
      }
      const map = mmap(); state.arcs.forEach(a=>layoutArc(a,map));
      placePerc(percList,false,pf);
      analyze();
      const bad = ui.analysis.ovl.size + ui.analysis.out.size;
      if(!best || bad < best.bad) best = {bad, snap:JSON.stringify({arcs:state.arcs, ms:musicians.map(m=>[m.x,m.y,m.rot,m.arc])})};
      if(bad===0) break outer;
    }
    const o = JSON.parse(best.snap); state.arcs = o.arcs;
    musicians.forEach((m,i)=>{ [m.x,m.y,m.rot,m.arc] = o.ms[i]; });
  }
  ui.sel.clear(); ui.activeArc = null; ui.dirty = false;
}
/* Places the members of a row (arc or straight line) evenly along it. */
function layoutArc(arc,map){
  map = map || mmap();
  const ms = arc.members.map(id=>map.get(id)).filter(Boolean);
  arc.members = ms.map(m=>m.id);
  if(!ms.length) return;
  if(arc.shape==="line"){
    const dir=[Math.cos(rad(arc.ang)),Math.sin(rad(arc.ang))];
    const ws=ms.map(m=>inst(m.key).w+.06), tot=ws.reduce((a,b)=>a+b,0), gap=(arc.len-tot)/ms.length;
    let s=-arc.len/2+gap/2;
    for(let i=0;i<ms.length;i++){
      const m=ms[i], tt=s+ws[i]/2;
      m.x=r2(arc.x+dir[0]*tt); m.y=r2(arc.y+dir[1]*tt);
      m.rot = r2(m.face ? faceRot(m.x,m.y) : normA(arc.ang+(m.dr||0))); m.arc=arc.id; s+=ws[i]+gap;
    }
    return;
  }
  const c = arcCenter(arc), S = rad(arc.a1-arc.a0);
  const ws = ms.map(m=>angW(m,arc.r)), tot = ws.reduce((a,b)=>a+b,0);
  const gap = (S-tot)/ms.length;
  let s = gap/2;
  for(let i=0;i<ms.length;i++){
    const m = ms[i], w = ws[i], a = rad(arc.a0) + s + w/2;
    m.x = r2(c.x + arc.r*Math.sin(a)); m.y = r2(c.y - arc.r*Math.cos(a));
    m.rot = r2(normA(faceRot(m.x,m.y) + (m.face?0:(m.dr||0)))); m.arc = arc.id;
    s += w + gap;
  }
}
function layoutAllArcs(){ const map=mmap(); state.arcs.forEach(a=>layoutArc(a,map)); }
function detach(m){ m.dr = 0; if(!m.arc) return; const a = arcById(m.arc); if(a) a.members = a.members.filter(id=>id!==m.id); m.arc = null; }
function baseRot(m){ const a = m.arc && arcById(m.arc); if(!a) return null; return a.shape==="line" ? a.ang : faceRot(m.x,m.y); }
function setRot(m,v){ m.rot = r2(normA(v)); m.face = false; const b = baseRot(m); m.dr = b==null ? 0 : r2(normA(m.rot-b)); }

function nearestArc(x,y){
  let best=null, bd=.55;
  for(const a of state.arcs){
    if(a.shape==="line"){
      const dx=Math.cos(rad(a.ang)), dy=Math.sin(rad(a.ang)), vx=x-a.x, vy=y-a.y, tt=vx*dx+vy*dy, n=Math.abs(-vx*dy+vy*dx);
      if(n<bd && Math.abs(tt)<=a.len/2+.6){ bd=n; best=a; }

    }
    const c = arcCenter(a), dist = Math.hypot(x-c.x, y-c.y), an = deg(Math.atan2(x-c.x, c.y-y));
    const dd = Math.abs(dist-a.r);

function attachToArc(arc, ms){
  const map = mmap();
  ms.forEach(m=>{ if(m.arc!==arc.id) detach(m); });
  const c = arcCenter(arc);
  const ids = new Set([...arc.members, ...ms.map(m=>m.id)]);
  const list = [...ids].map(id=>map.get(id)).filter(Boolean);
  if(arc.shape==="line"){ const dx=Math.cos(rad(arc.ang)), dy=Math.sin(rad(arc.ang)); list.sort((p,q)=>((p.x-q.x)*dx+(p.y-q.y)*dy)); }
